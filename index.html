<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ലദൽ മദീന - അഡ്മിൻ പോർട്ടൽ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Chettan+2:wght@500;700;800&family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #450a0a; color: #f8fafc; overflow-x: hidden; scroll-behavior: smooth;}
        
        .fest-title { font-family: 'Baloo Chettan 2', sans-serif; font-weight: 800; }
        .num-font { font-family: 'Outfit', sans-serif; }
        
        .fest-logo-img { height: 35px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5)); display: inline-block; border-radius: 5px; }
        .fest-logo-img-large { height: 50px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6)); display: inline-block; border-radius: 8px;}
        
        .tab-active { border-bottom: 2px solid #fbbf24; color: #fbbf24; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #fca5a5; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a0202; }
        ::-webkit-scrollbar-thumb { background: #7f1d1d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #991b1b; }
        
        .glass-card { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.15); }

        .zero-gravity-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,0.15) 0%, transparent 70%); animation: floatOrb infinite linear; opacity: 0; }
        @keyframes floatOrb { 0% { transform: translateY(110vh) scale(0.5); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-20vh) scale(1.5); opacity: 0; } }

        @media (max-width: 768px) { .mobile-hide-text { display: none; } .mobile-small-text { font-size: 0.75rem; } .table-container { overflow-x: auto; } .fest-logo-img { height: 28px; } .fest-logo-img-large { height: 40px; } }

        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbbf24' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; padding-right: 2.5rem !important; }
        select option { background-color: #1a0202; color: #f8fafc; }
        select optgroup { background-color: #450a0a; color: #fbbf24; font-style: normal; font-weight: bold; }
    </style>
</head>
<body>

    <div class="zero-gravity-bg" id="zg-bg"></div>

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span>
        <span id="toastMsg"></span>
    </div>

    <!-- Modals -->
    <div id="confirmModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-4">⚠️</div>
            <h3 class="text-lg font-bold text-white mb-2">ഉറപ്പാണോ?</h3>
            <p id="confirmText" class="text-sm text-red-200 mb-6"></p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirm()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                <button onclick="executeConfirm()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-amber-900/50">അതെ, തുടരുക</button>
            </div>
        </div>
    </div>

    <div id="promptModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h3 id="promptTitle" class="text-lg font-bold text-white mb-4"></h3>
            <input type="text" id="promptInput" class="w-full bg-black border border-red-900 rounded-lg px-4 py-3 text-white outline-none focus:border-amber-500 mb-6">
            <div class="flex gap-3 justify-center">
                <button onclick="closePrompt()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                <button onclick="executePrompt()" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-yellow-900/50">സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <div id="editProgModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">മത്സരം എഡിറ്റ് ചെയ്യുക</h3>
            <form id="editProgForm" onsubmit="saveEditProgram(event)" class="space-y-3">
                <input type="hidden" id="epId">
                <div>
                    <label class="block text-xs font-bold text-red-200 mb-1">പേര് (മലയാളം & ഇംഗ്ലീഷ്)</label>
                    <textarea id="epName" required rows="2" placeholder="ഖിറാഅത്ത്&#10;Qira'at" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"></textarea>
                    <p class="text-[10px] text-red-400 mt-1">ആദ്യ വരി മലയാളം, രണ്ടാം വരി ഇംഗ്ലീഷ്</p>
                </div>
                <div><label class="block text-xs font-bold text-red-200 mb-1">വിഭാഗം</label><select id="epCat" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"><option value="Junior">Junior</option><option value="Senior">Senior</option><option value="General">General</option></select></div>
                <div><label class="block text-xs font-bold text-red-200 mb-1">തരം</label><select id="epType" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"><option value="Stage">Stage</option><option value="Non-Stage">Non-Stage</option></select></div>
                <div><label class="block text-xs font-bold text-red-200 mb-1">മോഡ്</label><select id="epMode" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"><option value="false">Individual</option><option value="true">Group / Team</option></select></div>
                <div class="flex items-center gap-2 mt-2"><input type="checkbox" id="epExempt" class="w-4 h-4 accent-yellow-500"><label class="text-xs font-bold text-red-100">പരിധിയിൽ ഉൾപ്പെടുത്തരുത്</label></div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" onclick="closeEditProgram()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                    <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-amber-900/50">സേവ് ചെയ്യുക</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Gallery Add Modal -->
    <div id="galleryModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4">Add to Fest Gallery</h3>
            <form onsubmit="saveGalleryItem(event)" class="space-y-3">
                <div><label class="block text-xs font-bold text-red-200 mb-1">URL (Image or Video Link)</label><input type="text" id="galUrl" required placeholder="https://example.com/video.mp4" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"></div>
                <div><label class="block text-xs font-bold text-red-200 mb-1">Type</label><select id="galType" class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"><option value="image">Image (Photo)</option><option value="video">Video (MP4)</option></select></div>
                <div><label class="block text-xs font-bold text-red-200 mb-1">Duration (Seconds)</label><input type="number" id="galDur" value="5" min="1" max="120" required class="w-full bg-black border border-red-900 rounded-lg px-3 py-2 text-white"></div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" onclick="closeGalleryModal()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                    <button type="submit" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-yellow-900/50">Add</button>
                </div>
            </form>
        </div>
    </div>

    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">മത്സരങ്ങൾ ചേർക്കുക</h3>
            <p class="text-xs text-amber-400 mb-1 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            <p class="text-[10px] text-red-300 mb-4 bg-red-950 p-2 rounded border border-red-900">⚠️ നിബന്ധനകൾ: <strong class="text-amber-400">3 Stage</strong> & <strong class="text-amber-200">5 Non-Stage</strong> ഒരാൾക്ക് പരമാവധി.</p>
            <div class="bg-black/50 border border-red-900 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="closeAssign()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                <button id="saveAssignBtn" onclick="saveAssign()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-amber-900/50">സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <div id="enrolledModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-lg font-bold text-white" id="enrolledTitle">രജിസ്റ്റർ ചെയ്തവർ</h3>
                <button onclick="closeEnrolled()" class="text-red-300 hover:text-white bg-red-950 hover:bg-red-900 rounded-full w-8 h-8 flex items-center justify-center transition">✕</button>
            </div>
            <p class="text-xs text-amber-200 mb-4 font-bold tracking-widest uppercase" id="enrolledSubtitle"></p>
            <div class="bg-black/50 border border-red-900 rounded-xl p-4 flex-1 overflow-y-auto custom-scrollbar">
                <div id="enrolledList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        function createZeroGravity() {
            const bg = document.getElementById('zg-bg'); if(!bg) return;
            const colors = ['#fbbf24', '#f59e0b', '#dc2626', '#fcd34d', '#b91c1c'];
            for(let i=0; i<25; i++) {
                const orb = document.createElement('div');
                orb.className = 'orb';
                const size = Math.random() * 80 + 30;
                orb.style.width = size + 'px'; orb.style.height = size + 'px';
                orb.style.left = Math.random() * 100 + 'vw';
                const color = colors[Math.floor(Math.random() * colors.length)];
                orb.style.background = `radial-gradient(circle, ${color}33 0%, transparent 70%)`;
                orb.style.animationDuration = (Math.random() * 15 + 15) + 's';
                orb.style.animationDelay = (Math.random() * 15) + 's';
                bg.appendChild(orb);
            }
        }
        window.addEventListener('DOMContentLoaded', createZeroGravity);

        const firebaseConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        const DEFAULT_TEAMS = {
            admin: { id: 'admin', name: 'Main Admin', pass: 'admin26' },
            teamA: { id: 'teamA', name: 'അൽ ബിറൂനി (Al-Biruni)', pass: 'biruni26', color: 'text-amber-400' },
            teamB: { id: 'teamB', name: 'അൽ ഖ്വാരിസ്മി (Al-Khwarizmi)', pass: 'khwarizmi26', color: 'text-yellow-200' }
        };

        const DEFAULT_PROGRAMS = [
            { id: 'p1', name: 'ഖിറാഅത്ത്\nQira\'at', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p2', name: 'സിംഗിൾ സോങ് (മദ്ഹ്)\nSingle Song', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p3', name: 'കഥ പറച്ചിൽ\nStory Telling', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p26', name: 'ക്വിസ്\nQuiz', cat: 'Junior', type: 'Non-Stage', isGroup: false, limitExempt: true },
            { id: 'p23', name: 'ബുർദ\nBurdha', cat: 'General', type: 'Stage', isGroup: true, limitExempt: true }
        ];

        let state = {
            user: null, role: sessionStorage.getItem('aura_role') || null, tab: 'dashboard',
            candidates: [], results: [], gallery: [], teams: DEFAULT_TEAMS, programs: DEFAULT_PROGRAMS,
            showChampions: false, showPoints: false, registrationLocked: false
        };

        window.fireConfetti = () => {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#dc2626', '#f59e0b', '#fcd34d'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#dc2626', '#f59e0b', '#fcd34d'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        };

        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast'); document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-red-950/90 border border-red-500/50 text-red-200' : 'bg-yellow-900/90 border border-yellow-500/50 text-yellow-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 4000); 
        };

        let loginRendered = false;
        function isUserTyping() {
            const active = document.activeElement;
            return active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
        }

        function handleDataUpdate() {
            if (!state.role) {
                if (!loginRendered) { render(); loginRendered = true; }
                return; 
            }
            if (isUserTyping()) { softUpdateUI(); } else { render(); }
        }

        function softUpdateUI() {
            if (!state.role) return; 
            if(state.tab === 'dashboard') {
                const scores = getTeamScores(); const totalPoints = scores.teamA + scores.teamB; 
                const teamAPct = totalPoints === 0 ? 50 : (scores.teamA / totalPoints) * 100; 
                const teamBPct = totalPoints === 0 ? 50 : (scores.teamB / totalPoints) * 100;
                
                const elTeamA = document.getElementById('dash-score-A'); if(elTeamA) elTeamA.innerText = scores.teamA;
                const elTeamB = document.getElementById('dash-score-B'); if(elTeamB) elTeamB.innerText = scores.teamB;
                const barA = document.getElementById('dash-bar-A'); if(barA) barA.style.width = teamAPct + '%';
                const barB = document.getElementById('dash-bar-B'); if(barB) barB.style.width = teamBPct + '%';
            }

            if(state.tab === 'programs') {
                const galList = document.getElementById('gal-list-container');
                if(galList) {
                    galList.innerHTML = state.gallery.length === 0 ? '<p class="text-red-300 text-sm">ഗാലറിയിൽ മീഡിയ ഇല്ല.</p>' : state.gallery.map(g => `
                        <div class="bg-red-950 border border-red-900 rounded-lg p-2 flex items-center gap-2 w-fit">
                            <span class="text-xl">${g.type==='video'?'🎥':'🖼️'}</span>
                            <div><p class="text-white text-xs font-bold truncate max-w-[120px]">${g.url.split('/').pop()}</p><p class="text-[9px] text-red-400">${g.duration} seconds</p></div>
                            <button onclick="deleteGalleryItem('${g.id}')" class="text-red-400 hover:bg-red-500 hover:text-white px-2 py-1 rounded bg-red-950/30 text-[10px] ml-2">🗑️</button>
                        </div>
                    `).join('');
                }
            }
        }

        const persistentGallery = document.createElement('div');
        persistentGallery.className = 'dash-gallery-container w-full h-[300px] md:h-[400px] relative overflow-hidden rounded-2xl border border-red-900 shadow-2xl bg-black mt-8 sm:mt-12';
        const galleryLabel = document.createElement('div');
        galleryLabel.className = 'absolute bottom-4 right-4 bg-black/60 px-4 py-2 rounded-xl text-xs font-bold border border-white/20 backdrop-blur-md z-20 text-white shadow-lg';
        galleryLabel.innerText = 'ലദൽ മദീന 2026';
        persistentGallery.appendChild(galleryLabel);

        let dashGalleryIndex = 0; let dashGalleryTimer = null; let isDashGalleryRunning = false; let dashGalleryLoopCount = 0; let maxAllowedLoops = 2;

        function updateGalleryMedia() {
            if(!state.gallery || state.gallery.length === 0) return;
            const currentMedia = persistentGallery.querySelectorAll('.dash-gallery-media');
            if (currentMedia.length !== state.gallery.length) {
                currentMedia.forEach(el => el.remove());
                state.gallery.forEach((item, index) => {
                    let el;
                    if(item.type === 'video') { 
                        el = document.createElement('video'); el.src = item.url; el.controls = true; el.preload = 'auto'; el.muted = false;
                        el.onplay = () => { if (!isDashGalleryRunning) { maxAllowedLoops = 1; dashGalleryLoopCount = 0; window.playDashGallery(); } };
                    } else { el = document.createElement('img'); el.src = item.url; }
                    el.className = 'dash-gallery-media absolute top-0 left-0 w-full h-full object-cover opacity-0 transition-opacity duration-1000 z-0'; 
                    el.id = 'dg-media-' + index;
                    persistentGallery.appendChild(el);
                });
            }
        }

        window.playDashGallery = () => {
            if(!state.gallery || state.gallery.length === 0) { isDashGalleryRunning = false; return; }
            if (dashGalleryLoopCount >= maxAllowedLoops) { isDashGalleryRunning = false; return; }
            isDashGalleryRunning = true; updateGalleryMedia(); 
            var allMedia = persistentGallery.querySelectorAll('.dash-gallery-media');
            allMedia.forEach(m => { m.classList.remove('opacity-100', 'z-10'); m.classList.add('opacity-0', 'z-0'); if(m.tagName === 'VIDEO') { m.pause(); m.currentTime = 0; } });

            if(dashGalleryIndex >= state.gallery.length) { dashGalleryIndex = 0; dashGalleryLoopCount++; if (dashGalleryLoopCount >= maxAllowedLoops) { isDashGalleryRunning = false; return; } }
            
            var el = persistentGallery.querySelector('#dg-media-' + dashGalleryIndex);
            if(el) {
                el.classList.remove('opacity-0', 'z-0'); el.classList.add('opacity-100', 'z-10');
                if(state.gallery[dashGalleryIndex].type === 'video') {
                    clearTimeout(dashGalleryTimer); 
                    let playPromise = el.play(); if(playPromise !== undefined) { playPromise.catch(e=>{ console.log("Autoplay prevented"); isDashGalleryRunning = false; }); }
                    el.onended = () => { dashGalleryIndex++; window.playDashGallery(); }; return; 
                }
            }

            let dur = (state.gallery[dashGalleryIndex]?.duration || 5) * 1000;
            dashGalleryIndex++; clearTimeout(dashGalleryTimer); dashGalleryTimer = setTimeout(window.playDashGallery, dur);
        };

        window.openGalleryModal = () => { document.getElementById('galleryModal').style.display = 'flex'; };
        window.closeGalleryModal = () => { document.getElementById('galleryModal').style.display = 'none'; };
        
        window.saveGalleryItem = async (e) => { e.preventDefault(); const url = document.getElementById('galUrl').value; const type = document.getElementById('galType').value; const dur = document.getElementById('galDur').value; const newItem = { id: 'g'+Date.now(), url: url, type: type, duration: parseInt(dur) }; const updatedGallery = [...state.gallery, newItem]; try { await updateDoc(doc(db, 'settings', 'config_v4'), { gallery: updatedGallery }); window.showAlert("Media Added to Gallery!"); closeGalleryModal(); e.target.reset(); } catch(err) { window.showAlert("Failed to add", "error"); } };

                            <div class="overflow-x-auto overflow-y-auto flex-1 custom-scrollbar w-full border border-red-900 rounded-xl bg-black/30">
                                <table class="w-full text-left text-[11px] sm:text-sm whitespace-nowrap">
                                    <thead class="bg-red-950 text-red-300 text-[10px] sm:text-xs uppercase sticky top-0 z-10 shadow border-b border-red-900"><tr><th class="p-3 sm:p-4">പേര്</th><th class="p-3 sm:p-4 mobile-hide-text">വിഭാഗം</th><th class="p-3 sm:p-4">ടീം</th><th class="p-3 sm:p-4">മത്സരങ്ങൾ</th><th class="p-3 sm:p-4">Action</th></tr></thead>
                                    <tbody class="divide-y divide-red-900/50">
                                        ${state.candidates.length === 0 ? `<tr><td colspan="5" class="text-center p-8 text-red-300 text-sm">ആരെയും ചേർത്തിട്ടില്ല.</td></tr>` : ''}
                                        ${state.candidates.map(c => {
                                            const isMyTeam = state.role === c.team; const canManage = isAdmin || (isMyTeam && !state.registrationLocked); const eventCount = c.assignedPrograms ? c.assignedPrograms.length : 0;
                                            return `<tr class="hover:bg-red-900/40 transition"><td class="p-2 sm:p-4"><div class="font-bold text-white text-[12px] sm:text-sm">${c.name}</div><div class="text-[9px] sm:text-[10px] font-mono text-amber-400">${c.regNo}</div></td><td class="p-2 sm:p-4 text-red-100 font-medium num-font mobile-hide-text">${c.cat}</td><td class="p-2 sm:p-4 ${state.teams[c.team]?.color} font-bold text-[10px] sm:text-sm">${state.teams[c.team]?.name}</td><td class="p-2 sm:p-4">${canManage ? `<button onclick="openAssign('${c.id}')" class="bg-yellow-600/20 text-yellow-300 hover:bg-yellow-600 hover:text-white border border-yellow-500/50 px-2 py-1 sm:px-3 sm:py-1.5 rounded-lg text-[10px] sm:text-xs font-bold transition flex items-center gap-1 shadow-sm"><span>📅</span> <span class="hidden sm:inline">${eventCount > 0 ? `${eventCount} എണ്ണം ചേർത്തു` : 'ചേർക്കുക'}</span><span class="sm:hidden">${eventCount}</span></button>` : `<span class="text-red-300 text-[10px] sm:text-xs bg-red-950 px-2 py-1 rounded">${eventCount} <span class="hidden sm:inline">Events</span></span>`}</td><td class="p-2 sm:p-4 flex gap-1 sm:gap-2">${canManage ? `<button onclick="editParticipant('${c.id}', '${c.name.replace(/'/g, "\\'")}')" class="text-blue-400 hover:bg-blue-500 hover:text-white border border-blue-500/30 px-2 py-1 rounded-md text-[9px] sm:text-xs transition">Edit</button><button onclick="deleteCandidate('${c.id}')" class="text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 px-2 py-1 rounded-md text-[9px] sm:text-xs transition">Del</button>` : '<span class="text-red-400 text-[9px] sm:text-[10px] uppercase font-bold tracking-widest">Locked</span>'}</td></tr>`
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            if (state.tab === 'programs') {
                const cats = ['Junior', 'Senior', 'General'];
                let addForm = isAdmin ? `
                    <div class="glass-card p-4 sm:p-6 rounded-2xl mb-4 sm:mb-6 border border-amber-500/30 border-t border-red-900/50">
                        <h3 class="font-bold text-amber-400 mb-3 sm:mb-4 flex items-center gap-2 text-sm sm:text-base"><span>➕</span> പുതിയ മത്സരം ചേർക്കുക</h3>
                        <form onsubmit="addNewProgram(event)" class="flex flex-col md:flex-row flex-wrap gap-3 sm:gap-4 items-start">
                            <div class="w-full md:flex-1 md:min-w-[200px]"><label class="block text-[10px] sm:text-xs font-bold text-red-300 mb-1 sm:mb-2 uppercase tracking-wider">പേര് (മലയാളം & ഇംഗ്ലീഷ്)</label><textarea id="newProgName" required rows="2" placeholder="ഖിറാഅത്ത്&#10;Qira'at" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm"></textarea><p class="text-[10px] text-red-400 mt-1">ആദ്യ വരി മലയാളം, രണ്ടാം വരി ഇംഗ്ലീഷ്</p></div>
                            <div class="w-full md:w-auto"><label class="block text-[10px] sm:text-xs font-bold text-red-300 mb-1 sm:mb-2 uppercase tracking-wider">വിഭാഗം</label><select id="newProgCat" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 text-white outline-none text-sm"><option value="Junior">Junior</option><option value="Senior">Senior</option><option value="General">General</option></select></div>
                            <div class="w-full md:w-auto"><label class="block text-[10px] sm:text-xs font-bold text-red-300 mb-1 sm:mb-2 uppercase tracking-wider">തരം</label><select id="newProgType" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 text-white outline-none text-sm"><option value="Stage">Stage</option><option value="Non-Stage">Non-Stage</option></select></div>
                            <div class="w-full md:w-auto"><label class="block text-[10px] sm:text-xs font-bold text-red-300 mb-1 sm:mb-2 uppercase tracking-wider">മോഡ്</label><select id="newProgMode" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 text-white outline-none text-sm"><option value="false">Individual</option><option value="true">Group / Team</option></select></div>
                            <div class="w-full md:w-auto flex items-center gap-2 mt-1 sm:mt-8 self-start md:self-start mb-1"><input type="checkbox" id="newProgExempt" class="w-4 h-4 accent-yellow-500"><label class="text-[11px] sm:text-xs font-bold text-red-100 whitespace-nowrap">പരിധി ഒഴിവാക്കുക</label></div>
                            <button type="submit" id="addProgBtn" class="w-full md:w-auto bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg transition shadow-lg shadow-amber-900/50 mt-2 sm:mt-6 md:mt-6 text-sm">+ ചേർക്കുക</button>
                        </form>
                    </div>
                    <div class="glass-card p-4 sm:p-6 rounded-2xl mb-4 sm:mb-6 border border-yellow-500/30 border-t border-red-900/50">
                        <div class="flex justify-between items-center mb-3 sm:mb-4"><h3 class="font-bold text-yellow-400 flex items-center gap-2 text-sm sm:text-base"><span>📸</span> ഫെസ്റ്റ് ഗാലറി സെറ്റിംഗ്സ്</h3><button onclick="openGalleryModal()" class="bg-yellow-600 hover:bg-yellow-500 text-white text-[10px] sm:text-xs px-2 py-1.5 sm:px-3 rounded-lg font-bold shadow-sm">+ Add Media</button></div>
                        <div id="gal-list-container" class="flex flex-wrap gap-2 sm:gap-3"></div>
                    </div>` : '';

                mainContent += addForm + `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">`;
                cats.forEach(cat => {
                    mainContent += `<div class="glass-card p-3 sm:p-5 rounded-2xl h-fit border-t border-red-900/50"><h3 class="font-bold text-base sm:text-xl mb-3 sm:mb-4 text-white border-b border-red-900 pb-2 flex justify-between items-center num-font">${cat} Schedule</h3><ul class="space-y-2 sm:space-y-3">`;
                    state.programs.filter(p => p.cat === cat).forEach(p => {
                        let enrolledProgs = state.candidates.filter(c => c.assignedPrograms && c.assignedPrograms.includes(p.id)); if (state.role && !isAdmin) enrolledProgs = enrolledProgs.filter(c => c.team === state.role); const assignedCount = enrolledProgs.length;
                        var pNames = p.name.split('\n'); var mlName = pNames[0]; var enName = pNames.length > 1 ? "<span class='block text-[10px] text-red-300 font-normal mt-0.5'>" + pNames[1] + "</span>" : "";
                        mainContent += `<li class="bg-red-950/80 p-2 sm:p-3 rounded-xl border border-red-900/50 flex justify-between items-center transition hover:border-red-500 group"><div class="w-full"><span class="block text-white font-bold text-[13px] sm:text-sm mb-1">${mlName} ${enName} ${isAdmin ? `<button onclick="openEditProgram('${p.id}')" class="text-[10px] sm:text-xs ml-2 text-red-400 opacity-100 sm:opacity-0 group-hover:opacity-100 hover:text-amber-400 transition-opacity">✏️</button><button onclick="deleteProgram('${p.id}')" class="text-[10px] sm:text-xs ml-1 text-red-700 opacity-100 sm:opacity-0 group-hover:opacity-100 hover:text-red-400 transition-opacity">🗑️</button>` : ''}</span><div class="flex justify-between items-center w-full"><div class="flex gap-1 flex-wrap"><span class="text-[8px] sm:text-[9px] ${p.type==='Stage'?'text-amber-400':'text-yellow-200'} bg-black px-1.5 sm:px-2 py-0.5 rounded uppercase tracking-wider border border-red-900">${p.type}</span>${p.isGroup ? `<span class="text-[8px] sm:text-[9px] text-amber-400 bg-black px-1.5 sm:px-2 py-0.5 rounded uppercase tracking-wider border border-amber-900/50">👥 Group</span>` : ''}${p.limitExempt ? `<span class="text-[8px] sm:text-[9px] text-yellow-400 bg-black px-1.5 sm:px-2 py-0.5 rounded uppercase tracking-wider border border-yellow-900/50" title="പരിധിയിൽ ഉൾപ്പെടുന്നില്ല">🛡️ No Limit</span>` : ''}</div><button onclick="openEnrolled('${p.id}')" class="text-[9px] text-yellow-300 bg-yellow-950/50 hover:bg-yellow-600 hover:text-white px-2 py-1 rounded uppercase font-bold border border-yellow-900/50 transition cursor-pointer flex items-center gap-1 shadow-sm flex-shrink-0">👤 ${assignedCount}</button></div></div></li>`;
                    });
                    mainContent += `</ul></div>`;
                });
                mainContent += `</div>`;
            }

            if (state.tab === 'results') {
                mainContent = `
                    <div class="flex flex-col lg:flex-row gap-4 sm:gap-6">
                        ${isAdmin ? `
                            <div class="w-full lg:w-5/12 flex flex-col gap-4 sm:gap-6">
                                <div class="glass-card p-4 sm:p-6 rounded-2xl border border-yellow-500/30">
                                    <h3 class="font-bold text-yellow-400 mb-3 sm:mb-4 text-base sm:text-lg flex items-center gap-2"><span class="text-xl sm:text-2xl">🏆</span> റിസൾട്ട് നൽകുക</h3>
                                    <form onsubmit="publishResult(event)">
                                        <select id="rProg" onchange="populateResultDropdowns()" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 sm:px-4 sm:py-3 text-white outline-none focus:border-yellow-500 font-semibold mb-3 sm:mb-4 shadow-inner text-sm">
                                            <option value="">-- മത്സരം തിരഞ്ഞെടുക്കുക --</option>
                                            ${state.programs.map(p => `<option value="${p.id}">${p.name.replace(/\n/g, ' ')} (${p.cat})</option>`).join('')}
                                        </select>
                                        <div id="rSelectors"></div>
                                    </form>
                                </div>
                            </div>
                        ` : ''}
                        <div class="w-full ${isAdmin ? 'lg:w-7/12' : ''} glass-card p-3 sm:p-6 rounded-2xl flex flex-col h-[500px] sm:h-[700px] border-t border-red-900/50">
                            <div class="flex justify-between items-center border-b border-red-900 pb-3 sm:pb-4 mb-3 sm:mb-4 px-2 sm:px-0"><h3 class="font-bold text-white text-base sm:text-xl">റിസൾട്ടുകൾ</h3><span id="res-count-badge" class="bg-red-950 text-red-300 text-[10px] sm:text-xs px-2 sm:px-3 py-1 rounded-full font-bold border border-red-900 shadow-inner">${sortedResults.length} Published</span></div>
                            <div class="space-y-3 sm:space-y-4 overflow-y-auto flex-1 pr-1 sm:pr-2 custom-scrollbar">
                                ${sortedResults.length === 0 ? `<div class="text-center p-6 sm:p-10 text-red-300 text-sm">ആദ്യ റിസൾട്ടിനായി കാത്തിരിക്കുന്നു...</div>` : ''}
                                ${sortedResults.map((res, index) => {
                                    const prog = state.programs.find(p => p.id === res.progId); const isNew = index === 0; const cardClass = isNew ? "bg-red-950 border-yellow-500/50 shadow-[0_0_20px_rgba(234,179,8,0.1)]" : "bg-black/80 border-red-900";
                                    var pNames = prog ? prog.name.split('\n') : ['-']; var mlName = pNames[0]; var enName = pNames.length > 1 ? "<span class='block text-[11px] text-red-300 font-normal mt-1'>" + pNames[1] + "</span>" : "";
                                    return `<div class="border p-3 sm:p-5 rounded-2xl relative overflow-hidden transition-all ${cardClass}">${isNew ? '<div class="absolute top-0 right-0 bg-yellow-500 text-black text-[8px] sm:text-[9px] font-black uppercase px-2 sm:px-3 py-1 rounded-bl-lg tracking-widest animate-pulse shadow-md">Newest</div>' : ''}${isAdmin ? `<button onclick="deleteResult('${res.progId}')" class="absolute top-2 right-2 sm:top-3 sm:right-4 ${isNew?'mt-5 sm:mt-4':''} text-red-400 hover:text-white bg-red-950/50 hover:bg-red-600 border border-red-500/30 px-2 py-1 rounded text-[9px] sm:text-[10px] font-bold transition z-10">Delete</button>` : ''}<h4 class="font-bold text-white text-[14px] sm:text-lg mb-3 sm:mb-4 flex items-center gap-1.5 sm:gap-2 flex-wrap pr-10 sm:pr-14"><div>${mlName} ${enName}</div> <span class="text-[8px] sm:text-[10px] text-red-300 bg-red-900 px-1.5 sm:px-2 py-0.5 rounded uppercase font-bold tracking-wider num-font">${prog?.cat}</span>${prog?.isGroup ? `<span class="text-[7px] sm:text-[9px] text-amber-400 bg-amber-950 px-1.5 sm:px-2 py-0.5 rounded uppercase font-bold tracking-wider border border-amber-800">👥 Group</span>` : ''}</h4><div class="space-y-1.5 sm:pr-0">${getNamesBadgeHtml(res.first, 'border-yellow-500/30 bg-yellow-950/20', 'text-yellow-400', '🥇')}${getNamesBadgeHtml(res.second, 'border-slate-600', 'text-slate-300', '🥈')}${getNamesBadgeHtml(res.third, 'border-amber-900/40', 'text-amber-600', '🥉')}</div></div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            app.innerHTML = `
                <header class="bg-black/90 backdrop-blur-xl border-b border-red-900 p-3 sm:p-4 px-3 sm:px-6 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center gap-2 sm:gap-3">
                        ${logoHtml}
                        <div class="ml-1">
                            <h1 class="text-white text-[15px] sm:text-xl tracking-tight leading-none mb-0.5 sm:mb-1 font-sans font-bold" style="letter-spacing:1px;"><span class="font-sans text-[7px] sm:text-[9px] bg-yellow-500/20 text-yellow-400 px-1.5 sm:px-2 py-0.5 rounded-full border border-yellow-500/50 align-middle uppercase tracking-widest font-black shadow-sm shadow-yellow-500/20">Admin Portal</span></h1>
                            <p class="text-[8px] sm:text-[10px] text-red-300 font-semibold mt-1">ലോഗിൻ: <span class="text-white">${state.teams[state.role]?.name || state.role}</span></p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="px-2 sm:px-4 py-1.5 sm:py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-[9px] sm:text-xs font-bold uppercase tracking-widest transition border border-red-800 shadow-sm num-font">Sign Out</button>
                </header>
                ${navHtml}
                <main class="flex-1 p-2 sm:p-6 max-w-7xl w-full mx-auto relative z-10 pb-10">
                    ${mainContent}
                </main>
            `;

            if(state.role) softUpdateUI();

            if (state.tab === 'dashboard' && !isAdmin && state.gallery && state.gallery.length > 0) {
                setTimeout(() => {
                    const mount = document.getElementById('gallery-mount-point');
                    if (mount) {
                        mount.appendChild(persistentGallery);
                        if (!isDashGalleryRunning && state.gallery.length > 0) {
                            window.playDashGallery();
                        }
                    }
                }, 0);
            }
        }
    </script>
</body>
</html>
