<body class="bg-gradient-to-br from-purple-950 via-slate-950 to-indigo-950 min-h-screen">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[400] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl text-center border border-amber-500/30">
            <h3 class="text-lg font-bold text-white mb-2" id="confirmTitle">Confirm</h3>
            <p class="text-sm text-purple-200 mb-6" id="confirmMsg">Are you sure?</p>
            <div class="flex gap-3 justify-center">
                <button id="confirmCancelBtn" class="px-5 py-2 bg-purple-950 hover:bg-purple-900 text-white rounded-lg text-sm font-semibold transition border border-purple-700">റദ്ദാക്കുക (No)</button>
                <button id="confirmOkBtn" class="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-black rounded-lg text-sm font-bold transition shadow-lg">തുടരുക (Yes)</button>
            </div>
        </div>
    </div>

    <!-- Edit Candidate Modal -->
    <div id="editCandModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-amber-500/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4 border-b border-purple-800 pb-2">Edit Candidate</h3>
            <form id="editCandForm" onsubmit="saveEditCand(event)" class="space-y-3">
                <input type="hidden" id="editCandId">
                <div>
                    <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Name</label>
                    <input type="text" id="editCandName" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Chest No</label>
                        <input type="text" id="editCandRegNo" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Class & Div</label>
                        <input type="text" id="editCandClassDiv" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                    </div>
                </div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" onclick="document.getElementById('editCandModal').style.display='none'" class="px-4 py-2 bg-purple-950 text-white rounded-lg text-sm border border-purple-700">Cancel</button>
                    <button type="submit" id="saveEditCandBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

            let dataToImport = [];
            let label = "";

            if(listType === 'KW_BOYS') { dataToImport = KHAIBAR_BOYS_DATA; label = "Khaibar Warriors (Boys - 113)"; } 
            else if(listType === 'KW_GIRLS') { dataToImport = KHAIBAR_GIRLS_DATA; label = "Khaibar Warriors (Girls - 136)"; } 
            else if(listType === 'KF_BOYS') { dataToImport = KHANDAQ_BOYS_DATA; label = "Khandaq Fighters (Boys - 116)"; } 
            else if(listType === 'KF_GIRLS') { dataToImport = KHANDAQ_GIRLS_DATA; label = "Khandaq Fighters (Girls - 140)"; } 
            else { dataToImport = [...KHAIBAR_BOYS_DATA, ...KHAIBAR_GIRLS_DATA, ...KHANDAQ_BOYS_DATA, ...KHANDAQ_GIRLS_DATA]; label = "All Teams Data (505 Candidates)"; }

            window.showConfirm("Sync Data", `${label} ഡാറ്റാബേസിലേക്ക് സിങ്ക് ചെയ്യണോ?`, async () => {
                try {
                    let count = 0;
                    const existingChestNos = new Set(state.candidates.map(c => String(c.regNo)));
                    
                    let batches = [];
                    let currentBatch = writeBatch(db);
                    let opCount = 0;

                    for (const item of dataToImport) {
                        if (!existingChestNos.has(String(item.regNo))) {
                            const docRef = doc(collection(db, 'candidates'));
                            currentBatch.set(docRef, {
                                name: item.name,
                                regNo: String(item.regNo),
                                classDiv: item.classDiv,
                                cat: item.cat,
                                team: item.team,
                                gender: item.gender,
                                assignedPrograms: [],
                                timestamp: Date.now() + count
                            });
                            count++;
                            opCount++;
                            
                            if (opCount === 490) {
                                batches.push(currentBatch);
                                currentBatch = writeBatch(db);
                                opCount = 0;
                            }
                        }
                    }
                    
                    if (opCount > 0) batches.push(currentBatch);
                    for(let b of batches) await b.commit();
                    
                    window.showAlert(`${count} പുതിയ കുട്ടികളെ വിജയികരമായി ചേർത്തു!`);
                } catch (err) {
                    window.showAlert("Error: " + err.message, "error");
                }
            });
        };

        window.syncProgramList = (programListConfig, title) => {
            window.showConfirm(`Sync ${title}`, `Add ${title} programs and automatically assign candidates?`, async () => {
                try {
                    let updatedProgs = [...state.programs];
                    const newIdsMap = {}; 
                    let progsAdded = 0;

                    programListConfig.forEach(kp => {
                        let existing = updatedProgs.find(p => p.progNo === kp.no);
                        if(!existing) {
                            const newId = 'p' + Date.now() + Math.floor(Math.random()*1000);
                            updatedProgs.push({ id: newId, progNo: kp.no, name: kp.name, cat: kp.cat, type: kp.type, timestamp: Date.now() });
                            newIdsMap[kp.no] = newId;
                            progsAdded++;
                        } else {
                            newIdsMap[kp.no] = existing.id;
                        }
                    });

                    await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs });

                    let assignCount = 0;
                    let batches = [];
                    let currentBatch = writeBatch(db);
                    let opCount = 0;

                    for (const kp of programListConfig) {
                        const progId = newIdsMap[kp.no];
                        if(!progId) continue;
                        
                        for (const chestNo of kp.cands) {
                            const cand = state.candidates.find(c => String(c.regNo) === String(chestNo));
                            if(cand) {
                                let assigned = cand.assignedPrograms || [];
                                if(!assigned.includes(progId)) {
                                    assigned.push(progId);
                                    currentBatch.update(doc(db, 'candidates', cand.id), { assignedPrograms: assigned });
                                    assignCount++;
                                    opCount++;
                                    
                                    if(opCount === 490) {
                                        batches.push(currentBatch);
                                        currentBatch = writeBatch(db);
                                        opCount = 0;
                                    }
                                }
                            }
                        }
                    }
                    if(opCount > 0) batches.push(currentBatch);
                    for(let b of batches) await b.commit();
                    
                    window.showAlert(`Success! Added ${progsAdded} programs and assigned ${assignCount} candidates.`);
                } catch(e) {
                    window.showAlert("Error: " + e.message, "error");
                }
            });
        };

                                            const eventCount = c.assignedPrograms ? c.assignedPrograms.length : 0;
                                            return `
                                            <tr class="hover:bg-purple-900/30 transition">
                                                <td class="p-3 font-mono font-bold text-amber-400 num-font text-sm">#${c.regNo}</td>
                                                <td class="p-3"><div class="font-bold text-white">${c.name}</div></td>
                                                <td class="p-3">
                                                    <span class="text-[10px] font-bold text-amber-300 bg-purple-950 px-2 py-0.5 rounded border border-purple-800">${c.team || '-'}</span>
                                                    <span class="text-[9px] font-bold ${c.gender==='GIRLS'?'text-pink-300':'text-purple-300'} bg-black px-1.5 py-0.5 rounded ml-1">${c.gender || '-'}</span>
                                                </td>
                                                <td class="p-3 text-purple-200 font-semibold">${c.classDiv || '-'}</td>
                                                <td class="p-3"><span class="bg-purple-950 text-purple-200 border border-purple-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase">${c.cat}</span></td>
                                                <td class="p-3">
                                                    <button onclick="openAssign('${c.id}')" class="bg-amber-500/20 text-amber-300 hover:bg-amber-600 hover:text-black border border-amber-500/50 px-2.5 py-1 rounded-lg text-xs font-bold transition">
                                                        ${eventCount > 0 ? `${eventCount} Events` : '+ Add'}
                                                    </button>
                                                </td>
                                                <td class="p-3 text-right">
                                                    <div class="flex justify-end gap-1.5">
                                                        <button onclick="openEditCand('${c.id}')" class="text-amber-400 hover:bg-amber-600 hover:text-black border border-amber-500/30 px-2 py-1 rounded text-xs transition font-semibold">Edit</button>
                                                        <button onclick="deleteCandidate('${c.id}')" class="text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 px-2 py-1 rounded text-xs transition">Del</button>
                                                    </div>
                                                </td>
                                            </tr>`
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            if (state.tab === 'programs') {
                const programCats = [...CATEGORIES, 'General'];
                
                let addForm = `
                    <div class="glass-card p-5 rounded-2xl mb-6 border-t border-amber-500/40 mt-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                            <h3 class="font-bold text-amber-400 text-sm sm:text-base">പുതിയ മത്സരം ചേർക്കുക (Add Program)</h3>
                            <div class="flex flex-wrap gap-2">
                                <button onclick='syncProgramList(${JSON.stringify(KIDDIES_PROGRAMS)}, "Kiddies")' class="bg-emerald-600/90 hover:bg-emerald-500 text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg transition shadow border border-emerald-500 flex items-center gap-1">
                                    ⚡ Sync Kiddies
                                </button>
                                <button onclick='syncProgramList(${JSON.stringify(SUBJUNIOR_PROGRAMS)}, "Sub Junior")' class="bg-blue-600/90 hover:bg-blue-500 text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg transition shadow border border-blue-500 flex items-center gap-1">
                                    ⚡ Sync Sub Junior
                                </button>
                                <button onclick='syncProgramList(${JSON.stringify(JUNIOR_PROGRAMS)}, "Junior")' class="bg-pink-600/90 hover:bg-pink-500 text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg transition shadow border border-pink-500 flex items-center gap-1">
                                    ⚡ Sync Junior
                                </button>
                                <button onclick='syncProgramList(${JSON.stringify(SENIOR_PROGRAMS)}, "Senior")' class="bg-violet-600/90 hover:bg-violet-500 text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-lg transition shadow border border-violet-500 flex items-center gap-1">
                                    ⚡ Sync Senior
                                </button>
                            </div>
                        </div>
                        <form onsubmit="addNewProgram(event)" class="flex flex-col md:flex-row flex-wrap gap-4 items-end">
                            <div class="w-full md:w-20">
                                <label class="block text-[10px] font-bold text-purple-300 mb-1 uppercase">Prog No</label>
                                <input type="text" id="pNo" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2.5 text-white outline-none focus:border-amber-500 text-sm font-mono" placeholder="No.">
                            </div>
                            <div class="w-full md:flex-1 min-w-[150px]">
                                <label class="block text-[10px] font-bold text-purple-300 mb-1 uppercase">മത്സരത്തിന്റെ പേര് (Name)</label>
                                <input type="text" id="pName" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-4 py-2.5 text-white outline-none focus:border-amber-500 text-sm">
                            </div>
                            <div class="w-full md:w-auto">
                                <label class="block text-[10px] font-bold text-purple-300 mb-1 uppercase">വിഭാഗം</label>
                                <select id="pCat" class="w-full bg-black/80 border border-purple-800 rounded-lg px-4 py-2.5 text-white outline-none text-sm">
                                    ${programCats.map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div class="w-full md:w-auto">
                                <label class="block text-[10px] font-bold text-purple-300 mb-1 uppercase">തരം</label>
                                <select id="pType" class="w-full bg-black/80 border border-purple-800 rounded-lg px-4 py-2.5 text-white outline-none text-sm">
                                    <option value="Stage">Stage</option><option value="Non-Stage">Non-Stage</option>
                                </select>
                            </div>
                            <button type="submit" id="addProgBtn" class="w-full md:w-auto bg-amber-600 hover:bg-amber-500 text-white font-bold px-5 py-2.5 rounded-lg transition shadow-lg text-sm">+ ചേർക്കുക</button>
                        </form>
                    </div>`;

                mainContent += addForm + `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">`;
                
                programCats.forEach(cat => {
                    const catProgs = state.programs.filter(p => p.cat === cat).sort((a,b)=> Number(a.progNo || 0) - Number(b.progNo || 0));
                    if(catProgs.length === 0) return; 
                    
                    mainContent += `<div class="glass-card p-4 sm:p-5 rounded-2xl h-fit border-t border-purple-800">
                        <h3 class="font-bold text-base mb-3 text-amber-300 border-b border-purple-800 pb-2">${cat}</h3>
                        <ul class="space-y-2">`;
                    
                    catProgs.forEach(p => {
                        const enrolledCount = state.candidates.filter(c => c.assignedPrograms && c.assignedPrograms.includes(p.id)).length;
                        mainContent += `
                            <li class="bg-purple-950/80 p-3 rounded-xl border border-purple-800 flex flex-col group">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="block text-white font-bold text-sm leading-tight">${p.progNo ? `<span class="text-amber-500 font-mono mr-1">#${p.progNo}</span>` : ''}${p.name}</span>
                                    <div class="flex gap-1.5 opacity-60 group-hover:opacity-100 transition">
                                        <button onclick="openEditProg('${p.id}')" class="text-[10px] text-amber-400 hover:text-amber-300 bg-black/50 px-2 py-1 rounded border border-purple-700 transition">Edit</button>
                                        <button onclick="deleteProgram('${p.id}')" class="text-[10px] text-red-400 hover:text-red-300 bg-black/50 px-2 py-1 rounded border border-purple-700 transition">Del</button>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center mt-1">
                                    <span class="text-[9px] ${p.type==='Stage'?'text-amber-400':'text-purple-300'} bg-black/80 px-2 py-0.5 rounded border border-purple-800">${p.type}</span>
                                    <button onclick="openEnrolled('${p.id}')" class="text-[10px] text-amber-300 bg-purple-900 hover:bg-amber-600 hover:text-black px-2.5 py-1 rounded font-bold border border-purple-700 transition">👤 ${enrolledCount}</button>
                                </div>
                            </li>`;
                    });
                    mainContent += `</ul></div>`;
                });
                mainContent += `</div>`;
            }

            if (state.tab === 'results') {
                const sortedResults = [...state.results].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                mainContent = `
                    <div class="flex flex-col lg:flex-row gap-4 sm:gap-6 mt-4">
                        <div class="w-full lg:w-5/12 flex flex-col gap-4 sm:gap-6">
                            <div class="glass-card p-4 sm:p-6 rounded-2xl border border-amber-500/40">
                                <h3 class="font-bold text-amber-400 mb-3 sm:mb-4 text-base sm:text-lg flex items-center gap-2"><span class="text-xl sm:text-2xl">🏆</span> റിസൾട്ട് നൽകുക</h3>
                                <form onsubmit="publishResult(event)">
                                    <select id="rProg" onchange="populateResultDropdowns()" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 sm:px-4 sm:py-3 text-white outline-none focus:border-amber-400 font-semibold mb-3 sm:mb-4 shadow-inner text-sm">
                                        <option value="">-- മത്സരം തിരഞ്ഞെടുക്കുക --</option>
                                        ${[...state.programs].sort((a,b)=>Number(a.progNo||0)-Number(b.progNo||0)).map(p => `<option value="${p.id}">${p.progNo ? `#${p.progNo} - ` : ''}${p.name} (${p.cat})</option>`).join('')}
                                    </select>
                                    <div id="rSelectors"></div>
                                </form>
                            </div>
                        </div>
                        
                        <div class="w-full lg:w-7/12 glass-card p-3 sm:p-6 rounded-2xl flex flex-col h-[500px] sm:h-[700px] border-t border-purple-800">
                            <div class="flex justify-between items-center border-b border-purple-800 pb-3 sm:pb-4 mb-3 sm:mb-4 px-2 sm:px-0">
                                <h3 class="font-bold text-white text-base sm:text-xl">റിസൾട്ടുകൾ</h3>
                                <span class="bg-purple-950 text-amber-300 text-[10px] sm:text-xs px-3 py-1 rounded-full font-bold border border-purple-800 shadow-inner">${sortedResults.length} Published</span>
                            </div>
                            <div class="space-y-3 sm:space-y-4 overflow-y-auto flex-1 pr-1 sm:pr-2 custom-scrollbar">
                                ${sortedResults.length === 0 ? `<div class="text-center p-6 sm:p-10 text-purple-300 text-sm">ആദ്യ റിസൾട്ടിനായി കാത്തിരിക്കുന്നു...</div>` : ''}
                                ${sortedResults.map((res, index) => {
                                    const prog = state.programs.find(p => p.id === res.progId); 
                                    const isNew = index === 0; 
                                    const cardClass = isNew ? "bg-purple-950/80 border-amber-500/50 shadow-[0_0_20px_rgba(245,158,11,0.15)]" : "bg-black/80 border-purple-800";
                                    return `<div class="border p-3 sm:p-5 rounded-2xl relative overflow-hidden transition-all ${cardClass}">
                                        ${isNew ? '<div class="absolute top-0 right-0 bg-amber-500 text-black text-[8px] sm:text-[9px] font-black uppercase px-2 sm:px-3 py-1 rounded-bl-lg tracking-widest animate-pulse shadow-md">Newest</div>' : ''}
                                        <button onclick="deleteResult('${res.progId}')" class="absolute top-2 right-2 sm:top-3 sm:right-4 ${isNew?'mt-5 sm:mt-4':''} text-red-400 hover:text-white bg-purple-950 hover:bg-red-600 border border-red-500/30 px-2 py-1 rounded text-[9px] sm:text-[10px] font-bold transition z-10">Delete</button>
                                        <h4 class="font-bold text-white text-[14px] sm:text-lg mb-3 sm:mb-4 pr-10">
                                            ${prog?.progNo ? `<span class="text-amber-500">#${prog.progNo}</span> ` : ''}${prog?.name || '-'} <span class="text-[8px] sm:text-[10px] text-amber-300 bg-purple-900 px-2 py-0.5 rounded ml-2 font-bold uppercase">${prog?.cat || ''}</span>
                                        </h4>
                                        <div class="space-y-1.5">
                                            ${getNamesBadgeHtml(res.first, 'border-yellow-500/50 bg-yellow-950/30', 'text-yellow-400', '🥇')}
                                            ${getNamesBadgeHtml(res.second, 'border-slate-500/50 bg-slate-900/30', 'text-slate-200', '🥈')}
                                            ${getNamesBadgeHtml(res.third, 'border-amber-700/50 bg-amber-950/30', 'text-amber-500', '🥉')}
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            app.innerHTML = `
                <header class="bg-purple-950/90 backdrop-blur-xl border-b border-purple-800/80 p-3 sm:p-4 px-4 sm:px-6 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-purple-600 flex items-center justify-center text-xl shadow-lg font-black text-black">⚔️</div>
                        <div>
                            <h1 class="text-white text-[15px] sm:text-xl tracking-tight leading-none mb-0.5 sm:mb-1 font-bold">LADAL MADEENA 2K26</h1>
                            <p class="text-[9px] sm:text-[10px] text-amber-300 font-bold uppercase tracking-widest">Admin Portal • Khaibar Warriors & Khandaq Fighters</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-purple-900/80 hover:bg-purple-800 text-purple-200 rounded-lg text-xs font-bold border border-purple-700 transition">Logout</button>
                </header>
                ${navHtml}
                <main class="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto pb-10">
                    ${mainContent}
                </main>
            `;
        }
    </script>
</body>
</html>
