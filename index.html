<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ലദൽ മദീന - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #450a0a; color: #f8fafc; overflow-x: hidden; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .tab-active { border-bottom: 2px solid #fbbf24; color: #fbbf24; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #fca5a5; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a0202; }
        ::-webkit-scrollbar-thumb { background: #7f1d1d; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #991b1b; }
        .glass-card { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .fest-logo-img { height: 35px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.5)); display: inline-block; border-radius: 5px; }
        .fest-logo-img-large { height: 60px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6)); display: inline-block; border-radius: 8px;}
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbbf24' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; padding-right: 2.5rem !important; }
        select option { background-color: #1a0202; color: #f8fafc; }
        select optgroup { background-color: #450a0a; color: #fbbf24; font-style: normal; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Modals -->
    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">മത്സരങ്ങൾ ചേർക്കുക</h3>
            <p class="text-xs text-amber-400 mb-4 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            <div class="bg-black/50 border border-red-900 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="closeAssign()" class="px-4 py-2 bg-red-950 hover:bg-red-900 text-white rounded-lg text-sm font-semibold transition border border-red-800">റദ്ദാക്കുക</button>
                <button id="saveAssignBtn" onclick="saveAssign()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition shadow-lg">സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <div id="enrolledModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-lg font-bold text-white" id="enrolledTitle">രജിസ്റ്റർ ചെയ്തവർ</h3>
                <button onclick="closeEnrolled()" class="text-red-300 hover:text-white bg-red-950 hover:bg-red-900 rounded-full w-8 h-8 flex items-center justify-center transition">✕</button>
            </div>
            <p class="text-xs text-amber-200 mb-4 font-bold tracking-widest uppercase" id="enrolledSubtitle"></p>
            <div class="bg-black/50 border border-red-900 rounded-xl p-4 flex-1 overflow-y-auto custom-scrollbar">
                <div id="enrolledList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="min-h-screen flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo3S007XNUl1bAfgAlMR1vJyDQBNFf6MI",
            authDomain: "kottam-eee89.firebaseapp.com",
            projectId: "kottam-eee89",
            storageBucket: "kottam-eee89.firebasestorage.app",
            messagingSenderId: "558082092753",
            appId: "1:558082092753:web:c0a69f647998061a3adff0"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        const CATEGORIES = ['Sub Junior', 'Junior', 'Senior', 'Super Senior'];
        const CAT_PREFIX = { 'Sub Junior': 'SJ', 'Junior': 'J', 'Senior': 'S', 'Super Senior': 'SS' };
        
        const ADMIN_PASSWORD = "admin"; 

        let state = {
            isAuthenticated: sessionStorage.getItem('admin_auth') === 'true',
            tab: 'dashboard', candidates: [], programs: [], results: []
        };

        window.fireConfetti = () => {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#dc2626', '#f59e0b', '#fcd34d'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#dc2626', '#f59e0b', '#fcd34d'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        };

        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast'); 
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-red-950/90 border border-red-500/50 text-red-200' : 'bg-yellow-900/90 border border-yellow-500/50 text-yellow-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 5000); 
        };

        const initDB = async () => {
            try { 
                await signInAnonymously(auth); 
            } catch (e) { 
                console.error("Firebase Login Failed:", e);
                window.showAlert("DB Auth Error: Please enable 'Anonymous' Sign-in in Firebase.", "error"); 
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, 'settings', 'config'), (snap) => {
                    if (snap.exists()) { state.programs = snap.data().programs || []; } 
                    else { setDoc(doc(db, 'settings', 'config'), { programs: [] }).catch(e=>{}); }
                    if(state.isAuthenticated) render();
                });

                onSnapshot(collection(db, 'candidates'), (snap) => {
                    state.candidates = snap.docs.map(d => ({ id: d.id, assignedPrograms: [], ...d.data() }));
                    if(state.isAuthenticated) render();
                });

                onSnapshot(collection(db, 'results'), (snap) => {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(state.isAuthenticated) render();
                });
            }
        });
        
        initDB(); 
        render();

        window.handleLogin = (e) => {
            e.preventDefault();
            const pass = document.getElementById('loginPass').value;
            if (pass === ADMIN_PASSWORD) {
                state.isAuthenticated = true;
                sessionStorage.setItem('admin_auth', 'true');
                window.showAlert("ലോഗിൻ വിജയകരം!");
                render(); 
            } else {
                window.showAlert("തെറ്റായ പാസ്സ്‌വേർഡ്!", "error");
            }
        };

        window.handleLogout = () => { state.isAuthenticated = false; sessionStorage.removeItem('admin_auth'); render(); };
        window.switchTab = (tab) => { state.tab = tab; render(); };

        // --- PROGRAM MANAGEMENT ---
        window.addNewProgram = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('pName').value; 
            const cat = document.getElementById('pCat').value; 
            const type = document.getElementById('pType').value; 
            
            const newProg = { id: 'p' + Date.now(), name, cat, type, timestamp: Date.now() }; 
            const updatedProgs = [...state.programs, newProg]; 
            
            const btn = document.getElementById('addProgBtn'); btn.disabled = true; btn.innerText = 'Saving...';
            try { await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs }); window.showAlert("മത്സരം ചേർത്തു!"); e.target.reset(); } 
            catch(err) { window.showAlert("Error: " + err.message, "error"); }
            finally { btn.disabled = false; btn.innerText = '+ ചേർക്കുക'; }
        };

        window.deleteProgram = async (id) => {
            if(confirm("ഈ മത്സരം ഡിലീറ്റ് ചെയ്യണോ?")) {
                const updatedProgs = state.programs.filter(p => p.id !== id); 
                try { await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs }); window.showAlert("ഡിലീറ്റ് ചെയ്തു!"); } 
                catch(e) { window.showAlert("പരാജയപ്പെട്ടു.", "error"); }
            }
        };

        // --- CANDIDATE MANAGEMENT ---
        window.addCandidate = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('cName').value; 
            const cat = document.getElementById('cCat').value; 
            const prefix = CAT_PREFIX[cat]; 
            const catCount = state.candidates.filter(c => c.cat === cat).length; 
            const regNo = prefix + (101 + catCount); 
            
            const btn = document.getElementById('addCandBtn'); btn.innerText = "Saving..."; btn.disabled = true; 
            
            try { 
                await addDoc(collection(db, 'candidates'), { name, regNo, cat, assignedPrograms: [], timestamp: Date.now() }); 
                window.showAlert(`കുട്ടിയെ ചേർത്തു! (No: ${regNo})`); e.target.reset(); document.getElementById('cCat').value = cat;
            } catch (err) { window.showAlert("Error: " + err.message, "error"); } 
            finally { btn.innerText = "സേവ് ചെയ്യുക"; btn.disabled = false; } 
        };

        window.deleteCandidate = async (id) => {
            if(confirm("ഈ കുട്ടിയെ ഡിലീറ്റ് ചെയ്യണോ?")) {
                try { await deleteDoc(doc(db, 'candidates', id)); window.showAlert("ഡിലീറ്റ് ചെയ്തു."); } 
                catch(e) { window.showAlert("പരാജയപ്പെട്ടു.", "error"); }
            }
        };

        // --- ASSIGN PROGRAMS ---
        let currentAssignCandidateId = null;
        window.openAssign = (candId) => {
            const candidate = state.candidates.find(c => c.id === candId); if (!candidate) return; currentAssignCandidateId = candId;
            document.getElementById('assignTitle').innerText = `മത്സരങ്ങൾ ചേർക്കുക`; document.getElementById('assignSubtitle').innerText = `${candidate.name} • ${candidate.cat}`;
            const eligibleProgs = state.programs.filter(p => p.cat === candidate.cat || p.cat === 'General'); const assigned = candidate.assignedPrograms || [];

            let html = '';
            if(eligibleProgs.length === 0) html = '<p class="text-red-300 text-sm">ഈ വിഭാഗത്തിൽ മത്സരങ്ങൾ ചേർത്തിട്ടില്ല.</p>';
            
            eligibleProgs.forEach(p => {
                const isChecked = assigned.includes(p.id) ? 'checked' : '';
                html += `<label class="flex items-center justify-between p-3 bg-red-950 border border-red-900 rounded-lg cursor-pointer hover:bg-red-900 transition">
                    <div>
                        <span class="text-white text-sm font-semibold block">${p.name}</span>
                        <span class="text-[10px] text-amber-200 uppercase">${p.cat} • ${p.type}</span>
                    </div>
                    <input type="checkbox" value="${p.id}" class="prog-checkbox w-5 h-5 accent-amber-500 rounded" ${isChecked}>
                </label>`;
            });
            document.getElementById('assignCheckboxes').innerHTML = html; document.getElementById('assignModal').style.display = 'flex';
        };

        window.closeAssign = () => { document.getElementById('assignModal').style.display = 'none'; currentAssignCandidateId = null; };

        window.saveAssign = async () => {
            if (!currentAssignCandidateId) return;
            const checkboxes = document.querySelectorAll('.prog-checkbox');
            const selectedProgs = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            const btn = document.getElementById('saveAssignBtn'); btn.innerText = 'Saving...'; btn.disabled = true;
            try { await updateDoc(doc(db, 'candidates', currentAssignCandidateId), { assignedPrograms: selectedProgs }); window.showAlert("സേവ് ചെയ്തു!"); closeAssign(); } 
            catch (e) { window.showAlert("Error: " + e.message, "error"); } 
            finally { btn.innerText = 'സേവ് ചെയ്യുക'; btn.disabled = false; }
        };

        window.openEnrolled = (progId) => {
            const prog = state.programs.find(p => p.id === progId); if(!prog) return;
            document.getElementById('enrolledTitle').innerText = prog.name; document.getElementById('enrolledSubtitle').innerText = `രജിസ്റ്റർ ചെയ്ത കുട്ടികൾ`;
            let enrolled = state.candidates.filter(c => c.assignedPrograms && c.assignedPrograms.includes(progId));
            let html = '';
            if(enrolled.length === 0) { html = `<p class="text-center text-red-300 text-sm py-4">ആരും രജിസ്റ്റർ ചെയ്തിട്ടില്ല.</p>`; } 
            else { 
                enrolled.forEach(c => { 
                    html += `<div class="bg-red-950 border border-red-900 p-3 rounded-lg flex justify-between items-center">
                        <div><p class="text-white font-bold text-sm">${c.name} <span class="text-xs text-red-300 font-normal">(${c.regNo})</span></p></div>
                        <span class="text-[10px] text-amber-400 font-bold uppercase">${c.cat}</span>
                    </div>`; 
                }); 
            }
            document.getElementById('enrolledList').innerHTML = html; document.getElementById('enrolledModal').style.display = 'flex';
        };
        window.closeEnrolled = () => { document.getElementById('enrolledModal').style.display = 'none'; };

        // --- RESULTS MANAGEMENT ---
        window.populateResultDropdowns = () => {
            const progId = document.getElementById('rProg').value;
            const prog = state.programs.find(p => p.id === progId);
            const container = document.getElementById('rSelectors');
            if (!prog) { container.innerHTML = ''; return; }

            const eligibleCands = state.candidates.filter(c => prog.cat === 'General' ? true : c.cat === prog.cat);
            const assignedCands = eligibleCands.filter(c => c.assignedPrograms && c.assignedPrograms.includes(progId));
            
            let optionsHtml = '<option value="" disabled>-- തിരഞ്ഞെടുക്കുക --</option>';
            if(assignedCands.length > 0) {
                optionsHtml += '<optgroup label="ഈ മത്സരത്തിലുള്ളവർ">';
                assignedCands.forEach(c => optionsHtml += `<option value="${c.id}">${c.regNo} - ${c.name}</option>`);
                optionsHtml += '</optgroup>';
            }

            container.innerHTML = `
                <div class="space-y-4 p-4 bg-black/50 rounded-xl border border-red-900 mt-4">
                    <div><label class="block text-xs font-bold text-yellow-500 mb-1">ഒന്നാം സ്ഥാനം (10 Pts) - <span class="text-red-300 font-normal">ഒന്നിലധികം പേരുണ്ടെങ്കിൽ Ctrl അമർത്തി സെലക്ട് ചെയ്യാം</span></label><select id="rFirst" multiple size="4" class="w-full bg-red-950 border border-red-900 rounded-lg px-3 py-2 text-white outline-none focus:border-yellow-500 custom-scrollbar">${optionsHtml}</select></div>
                    <div><label class="block text-xs font-bold text-slate-300 mb-1">രണ്ടാം സ്ഥാനം (5 Pts)</label><select id="rSecond" multiple size="4" class="w-full bg-red-950 border border-red-900 rounded-lg px-3 py-2 text-white outline-none focus:border-slate-400 custom-scrollbar">${optionsHtml}</select></div>
                    <div><label class="block text-xs font-bold text-amber-600 mb-1">മൂന്നാം സ്ഥാനം (3 Pts)</label><select id="rThird" multiple size="4" class="w-full bg-red-950 border border-red-900 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-600 custom-scrollbar">${optionsHtml}</select></div>
                </div>
                <button type="submit" id="publishBtn" class="w-full mt-4 bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-3 rounded-xl transition shadow-lg">റിസൾട്ട് പബ്ലിഷ് ചെയ്യുക</button>
            `;
        };

        window.publishResult = async (e) => {
            e.preventDefault();
            const progId = document.getElementById('rProg').value;
            const getSelected = (id) => Array.from(document.getElementById(id).selectedOptions).map(o => o.value).filter(v => v !== "");
            
            const first = getSelected('rFirst'); const second = getSelected('rSecond'); const third = getSelected('rThird');
            if (first.length === 0) return window.showAlert("ഒന്നാം സ്ഥാനം നിർബന്ധമാണ്!", "error");
            
            const btn = document.getElementById('publishBtn'); btn.innerText = "Publishing..."; btn.disabled = true;
            try { 
                await setDoc(doc(db, 'results', progId), { progId, first, second, third, timestamp: Date.now() }); 
                window.showAlert("റിസൾട്ട് പ്രസിദ്ധീകരിച്ചു!"); 
                document.getElementById('rProg').value = ""; document.getElementById('rSelectors').innerHTML = ""; 
                window.fireConfetti();
            } 
            catch(err) { window.showAlert("പരാജയപ്പെട്ടു: " + err.message, "error"); }
            finally { btn.innerText = "റിസൾട്ട് പബ്ലിഷ് ചെയ്യുക"; btn.disabled = false; }
        };

        window.deleteResult = async (progId) => {
            if(confirm("ഈ റിസൾട്ട് ഡിലീറ്റ് ചെയ്യണോ? പോയിന്റുകൾ മാറും.")) {
                try { await deleteDoc(doc(db, 'results', progId)); window.showAlert("റിസൾട്ട് ഡിലീറ്റ് ചെയ്തു."); } 
                catch(e) { window.showAlert("പരാജയപ്പെട്ടു.", "error"); }
            }
        };

        // --- RENDER UI ---
        const getCandNamesString = (ids) => { const arr = Array.isArray(ids) ? ids : (ids ? [ids] : []); if(arr.length === 0) return '-'; return arr.map(id => state.candidates.find(c => c.id === id)?.name || '-').join(', '); };
        const getNamesBadgeHtml = (ids, borderClass, textClass, icon) => { const arr = Array.isArray(ids) ? ids : (ids ? [ids] : []); if (arr.length === 0) return ''; return arr.map(id => { const c = state.candidates.find(x => x.id === id); return `<div class="flex justify-between items-center bg-red-950 p-2.5 rounded-lg border ${borderClass} mb-1.5"><div class="flex items-center gap-2"><span class="text-xl">${icon}</span> <p class="${textClass} font-bold text-sm truncate">${c?.name || '-'}</p></div> <span class="text-[10px] font-bold text-red-200 bg-black px-2 py-1 rounded border border-red-900 flex-shrink-0">${c?.regNo || '-'}</span></div>`; }).join(''); };


        function render() {
            const app = document.getElementById('app'); 

            if (!state.isAuthenticated) {
                app.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen">
                    <div class="glass-card max-w-sm w-full rounded-[2rem] p-8 shadow-2xl text-center">
                        <div class="flex items-center justify-center drop-shadow-lg mb-6"><img src="1000741398.jpg" class="fest-logo-img-large" alt="Ladal Madeena"></div>
                        <h2 class="text-2xl font-bold text-white mb-1">Admin Login</h2>
                        <p class="text-red-300 text-xs mb-6">Enter password to manage the fest</p>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <input type="password" id="loginPass" required class="w-full bg-black/80 border border-red-900 rounded-xl px-4 py-3 text-white outline-none focus:border-amber-500 text-center tracking-widest" placeholder="Password">
                            <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-amber-900/40">ലോഗിൻ</button>
                        </form>
                    </div>
                </div>`;
                return;
            }

            let navHtml = `
            <nav class="flex overflow-x-auto border-b border-red-900 bg-red-950/80 backdrop-blur-md px-2 sm:px-4 scrollbar-hide sticky top-[60px] sm:top-[68px] z-40 shadow-md">
                <button onclick="switchTab('dashboard')" class="px-5 py-4 font-bold text-[13px] sm:text-sm whitespace-nowrap transition-colors ${state.tab==='dashboard'?'tab-active':'tab-inactive'}">ഡാഷ്‌ബോർഡ്</button>
                <button onclick="switchTab('candidates')" class="px-5 py-4 font-bold text-[13px] sm:text-sm whitespace-nowrap transition-colors ${state.tab==='candidates'?'tab-active':'tab-inactive'}">കുട്ടികൾ</button>
                <button onclick="switchTab('programs')" class="px-5 py-4 font-bold text-[13px] sm:text-sm whitespace-nowrap transition-colors ${state.tab==='programs'?'tab-active':'tab-inactive'}">മത്സരങ്ങൾ</button>
                <button onclick="switchTab('results')" class="px-5 py-4 font-bold text-[13px] sm:text-sm whitespace-nowrap transition-colors ${state.tab==='results'?'tab-active':'tab-inactive'}">റിസൾട്ടുകൾ</button>
            </nav>`;
            
            let mainContent = '';

            if (state.tab === 'dashboard') {
                mainContent = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 mt-4">
                        <div class="glass-card p-5 rounded-2xl border-t border-yellow-500/30 flex flex-col justify-center text-center">
                            <span class="text-3xl mb-2 text-yellow-400">👤</span>
                            <div class="text-3xl font-black num-font text-white">${state.candidates.length}</div>
                            <div class="text-xs text-red-300 font-bold uppercase mt-1">Total Candidates</div>
                        </div>
                        <div class="glass-card p-5 rounded-2xl border-t border-amber-500/30 flex flex-col justify-center text-center">
                            <span class="text-3xl mb-2 text-amber-400">📋</span>
                            <div class="text-3xl font-black num-font text-white">${state.programs.length}</div>
                            <div class="text-xs text-red-300 font-bold uppercase mt-1">Total Programs</div>
                        </div>
                        <div class="glass-card p-5 rounded-2xl border-t border-emerald-500/30 flex flex-col justify-center text-center">
                            <span class="text-3xl mb-2 text-emerald-400">🏆</span>
                            <div class="text-3xl font-black num-font text-white">${state.results.length}</div>
                            <div class="text-xs text-red-300 font-bold uppercase mt-1">Published Results</div>
                        </div>
                        <div class="col-span-2 glass-card p-5 rounded-2xl border-t border-red-900/50">
                            <h3 class="font-bold text-white mb-3">Category Breakdown</h3>
                            <div class="grid grid-cols-2 gap-2">
                                ${CATEGORIES.map(cat => `
                                    <div class="bg-red-950/50 rounded-lg p-2 border border-red-900 flex justify-between items-center">
                                        <span class="text-xs text-red-200 font-bold">${cat}</span>
                                        <span class="bg-black text-amber-400 font-black num-font px-2 py-1 rounded text-sm">${state.candidates.filter(c=>c.cat===cat).length}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (state.tab === 'candidates') {
                mainContent = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6 mt-4">
                        <div class="lg:col-span-1 glass-card p-5 rounded-2xl h-fit border-t border-red-900/50">
                            <h3 class="font-bold text-white text-base mb-4">കുട്ടിയെ ചേർക്കുക</h3>
                            <form onsubmit="addCandidate(event)" class="space-y-4">
                                <div><input type="text" id="cName" required placeholder="കുട്ടിയുടെ പേര്" class="w-full bg-black/80 border border-red-900 rounded-lg px-4 py-3 text-white outline-none focus:border-amber-500 text-sm"></div>
                                <div>
                                    <label class="block text-[10px] font-bold text-red-300 uppercase tracking-wider mb-1">വിഭാഗം (Category)</label>
                                    <select id="cCat" class="w-full bg-black/80 border border-red-900 rounded-lg px-4 py-3 text-white outline-none focus:border-amber-500 text-sm">
                                        ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
                                    </select>
                                </div>
                                <button type="submit" id="addCandBtn" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white font-bold py-3 rounded-xl transition shadow-lg mt-2 text-sm">സേവ് ചെയ്യുക</button>
                            </form>
                        </div>
                        <div class="lg:col-span-2 glass-card p-4 sm:p-6 rounded-2xl flex flex-col h-[650px] border-t border-red-900/50">
                            <h3 class="font-bold text-white text-base mb-4">രജിസ്റ്റർ ചെയ്തവർ</h3>
                            <div class="overflow-x-auto overflow-y-auto flex-1 custom-scrollbar border border-red-900 rounded-xl bg-black/30">
                                <table class="w-full text-left text-xs sm:text-sm whitespace-nowrap">
                                    <thead class="bg-red-950 text-red-300 text-[10px] sm:text-xs uppercase sticky top-0 z-10 shadow border-b border-red-900">
                                        <tr><th class="p-3">പേര്</th><th class="p-3">വിഭാഗം</th><th class="p-3">Events</th><th class="p-3">Action</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-red-900/50">
                                        ${state.candidates.length === 0 ? `<tr><td colspan="4" class="text-center p-8 text-red-300">ആരെയും ചേർത്തിട്ടില്ല.</td></tr>` : ''}
                                        ${[...state.candidates].sort((a,b)=>a.timestamp-b.timestamp).map(c => {
                                            const eventCount = c.assignedPrograms ? c.assignedPrograms.length : 0;
                                            return `
                                            <tr class="hover:bg-red-900/40 transition">
                                                <td class="p-3"><div class="font-bold text-white">${c.name}</div><div class="text-[10px] font-mono text-amber-400">${c.regNo}</div></td>
                                                <td class="p-3 text-red-100 font-medium">${c.cat}</td>
                                                <td class="p-3">
                                                    <button onclick="openAssign('${c.id}')" class="bg-yellow-600/20 text-yellow-300 hover:bg-yellow-600 hover:text-white border border-yellow-500/50 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                                                        ${eventCount > 0 ? `${eventCount} Events` : '+ Add'}
                                                    </button>
                                                </td>
                                                <td class="p-3"><button onclick="deleteCandidate('${c.id}')" class="text-red-400 hover:bg-red-600 hover:text-white border border-red-500/30 px-2 py-1 rounded text-xs transition">Del</button></td>
                                            </tr>`
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            if (state.tab === 'programs') {
                const programCats = [...CATEGORIES, 'General'];
                
                let addForm = `
                    <div class="glass-card p-5 rounded-2xl mb-6 border-t border-amber-500/30 mt-4">
                        <h3 class="font-bold text-amber-400 mb-4 text-sm sm:text-base">പുതിയ മത്സരം ചേർക്കുക (Add Program)</h3>
                        <form onsubmit="addNewProgram(event)" class="flex flex-col md:flex-row flex-wrap gap-4 items-end">
                            <div class="w-full md:flex-1 min-w-[200px]">
                                <label class="block text-[10px] font-bold text-red-300 mb-1 uppercase">മത്സരത്തിന്റെ പേര്</label>
                                <input type="text" id="pName" required class="w-full bg-black/80 border border-red-900 rounded-lg px-4 py-2.5 text-white outline-none focus:border-amber-500 text-sm">
                            </div>
                            <div class="w-full md:w-auto">
                                <label class="block text-[10px] font-bold text-red-300 mb-1 uppercase">വിഭാഗം</label>
                                <select id="pCat" class="w-full bg-black/80 border border-red-900 rounded-lg px-4 py-2.5 text-white outline-none text-sm">
                                    ${programCats.map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div class="w-full md:w-auto">
                                <label class="block text-[10px] font-bold text-red-300 mb-1 uppercase">തരം</label>
                                <select id="pType" class="w-full bg-black/80 border border-red-900 rounded-lg px-4 py-2.5 text-white outline-none text-sm">
                                    <option value="Stage">Stage</option><option value="Non-Stage">Non-Stage</option>
                                </select>
                            </div>
                            <button type="submit" id="addProgBtn" class="w-full md:w-auto bg-amber-600 hover:bg-amber-500 text-white font-bold px-5 py-2.5 rounded-lg transition shadow-lg text-sm">+ ചേർക്കുക</button>
                        </form>
                    </div>`;

                mainContent += addForm + `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">`;
                
                programCats.forEach(cat => {
                    const catProgs = state.programs.filter(p => p.cat === cat);
                    if(catProgs.length === 0) return; 
                    
                    mainContent += `<div class="glass-card p-4 sm:p-5 rounded-2xl h-fit border-t border-red-900/50">
                        <h3 class="font-bold text-base mb-3 text-white border-b border-red-900 pb-2">${cat}</h3>
                        <ul class="space-y-2">`;
                    
                    catProgs.forEach(p => {
                        const enrolledCount = state.candidates.filter(c => c.assignedPrograms && c.assignedPrograms.includes(p.id)).length;
                        mainContent += `
                            <li class="bg-red-950/80 p-3 rounded-xl border border-red-900/50 flex justify-between items-center group">
                                <div class="w-full">
                                    <div class="flex justify-between">
                                        <span class="block text-white font-bold text-sm">${p.name}</span>
                                        <button onclick="deleteProgram('${p.id}')" class="text-xs text-slate-600 hover:text-red-500 transition">✕</button>
                                    </div>
                                    <div class="flex justify-between items-center mt-2">
                                        <span class="text-[9px] ${p.type==='Stage'?'text-amber-400':'text-yellow-200'} bg-black px-2 py-0.5 rounded border border-red-900">${p.type}</span>
                                        <button onclick="openEnrolled('${p.id}')" class="text-[10px] text-yellow-300 bg-yellow-950 hover:bg-yellow-600 hover:text-white px-2 py-1 rounded font-bold border border-yellow-900/50 transition">👤 ${enrolledCount}</button>
                                    </div>
                                </div>
                            </li>`;
                    });
                    mainContent += `</ul></div>`;
                });
                mainContent += `</div>`;
            }

            if (state.tab === 'results') {
                const sortedResults = [...state.results].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                mainContent = `
                    <div class="flex flex-col lg:flex-row gap-4 sm:gap-6 mt-4">
                        <div class="w-full lg:w-5/12 flex flex-col gap-4 sm:gap-6">
                            <div class="glass-card p-4 sm:p-6 rounded-2xl border border-yellow-500/30">
                                <h3 class="font-bold text-yellow-400 mb-3 sm:mb-4 text-base sm:text-lg flex items-center gap-2"><span class="text-xl sm:text-2xl">🏆</span> റിസൾട്ട് നൽകുക</h3>
                                <form onsubmit="publishResult(event)">
                                    <select id="rProg" onchange="populateResultDropdowns()" class="w-full bg-black/80 border border-red-900 rounded-lg px-3 py-2 sm:px-4 sm:py-3 text-white outline-none focus:border-yellow-500 font-semibold mb-3 sm:mb-4 shadow-inner text-sm">
                                        <option value="">-- മത്സരം തിരഞ്ഞെടുക്കുക --</option>
                                        ${state.programs.map(p => `<option value="${p.id}">${p.name} (${p.cat})</option>`).join('')}
                                    </select>
                                    <div id="rSelectors"></div>
                                </form>
                            </div>
                        </div>
                        
                        <div class="w-full lg:w-7/12 glass-card p-3 sm:p-6 rounded-2xl flex flex-col h-[500px] sm:h-[700px] border-t border-red-900/50">
                            <div class="flex justify-between items-center border-b border-red-900 pb-3 sm:pb-4 mb-3 sm:mb-4 px-2 sm:px-0">
                                <h3 class="font-bold text-white text-base sm:text-xl">റിസൾട്ടുകൾ</h3>
                                <span class="bg-red-950 text-red-300 text-[10px] sm:text-xs px-2 sm:px-3 py-1 rounded-full font-bold border border-red-900 shadow-inner">${sortedResults.length} Published</span>
                            </div>
                            <div class="space-y-3 sm:space-y-4 overflow-y-auto flex-1 pr-1 sm:pr-2 custom-scrollbar">
                                ${sortedResults.length === 0 ? `<div class="text-center p-6 sm:p-10 text-red-300 text-sm">ആദ്യ റിസൾട്ടിനായി കാത്തിരിക്കുന്നു...</div>` : ''}
                                ${sortedResults.map((res, index) => {
                                    const prog = state.programs.find(p => p.id === res.progId); 
                                    const isNew = index === 0; 
                                    const cardClass = isNew ? "bg-red-950 border-yellow-500/50 shadow-[0_0_20px_rgba(234,179,8,0.1)]" : "bg-black/80 border-red-900";
                                    return `<div class="border p-3 sm:p-5 rounded-2xl relative overflow-hidden transition-all ${cardClass}">
                                        ${isNew ? '<div class="absolute top-0 right-0 bg-yellow-500 text-black text-[8px] sm:text-[9px] font-black uppercase px-2 sm:px-3 py-1 rounded-bl-lg tracking-widest animate-pulse shadow-md">Newest</div>' : ''}
                                        <button onclick="deleteResult('${res.progId}')" class="absolute top-2 right-2 sm:top-3 sm:right-4 ${isNew?'mt-5 sm:mt-4':''} text-red-400 hover:text-white bg-red-950/50 hover:bg-red-600 border border-red-500/30 px-2 py-1 rounded text-[9px] sm:text-[10px] font-bold transition z-10">Delete</button>
                                        <h4 class="font-bold text-white text-[14px] sm:text-lg mb-3 sm:mb-4 pr-10">
                                            ${prog?.name || '-'} <span class="text-[8px] sm:text-[10px] text-red-300 bg-red-900 px-1.5 py-0.5 rounded ml-2">${prog?.cat || ''}</span>
                                        </h4>
                                        <div class="space-y-1.5">
                                            ${getNamesBadgeHtml(res.first, 'border-yellow-500/30 bg-yellow-950/20', 'text-yellow-400', '🥇')}
                                            ${getNamesBadgeHtml(res.second, 'border-slate-600', 'text-slate-300', '🥈')}
                                            ${getNamesBadgeHtml(res.third, 'border-amber-900/40', 'text-amber-600', '🥉')}
                                        </div>
                                    </div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            app.innerHTML = `
                <header class="bg-black/90 backdrop-blur-xl border-b border-red-900 p-3 sm:p-4 px-4 sm:px-6 flex justify-between items-center sticky top-0 z-50">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <div class="flex items-center drop-shadow-md"><img src="1000741398.jpg" class="fest-logo-img" alt="Ladal Madeena"></div>
                        <div>
                            <h1 class="text-white text-[15px] sm:text-xl tracking-tight leading-none mb-0.5 sm:mb-1 font-sans font-bold">Admin Portal</h1>
                            <p class="text-[8px] sm:text-[10px] text-red-300 font-semibold uppercase tracking-widest">Fest Management</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-200 rounded-lg text-xs font-bold border border-red-800 shadow-sm transition">Logout</button>
                </header>
                ${navHtml}
                <main class="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto pb-10">
                    ${mainContent}
                </main>
            `;
        }
    </script>
</body>
</html>
