<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urava Season 4 - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .tab-active { border-bottom: 3px solid #38bdf8; color: #38bdf8; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #94a3b8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 0.9em; padding-right: 2.2rem !important; }
        select option { background-color: #0f172a; color: #f8fafc; }
        
        /* Print Styles for 3x2 Inch ID Cards */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 0; margin: 0; padding: 0; }
            .id-card { 
                width: 3in; 
                height: 2in; 
                background: white !important; 
                color: black !important; 
                border: 1px dashed #ccc; 
                padding: 0.15in; 
                box-sizing: border-box; 
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
            }
            .id-header { text-align: center; border-bottom: 1px solid black; padding-bottom: 2px; margin-bottom: 4px; }
            .id-title { font-size: 10pt; font-weight: 900; margin: 0; font-family: 'Outfit', sans-serif; text-transform: uppercase; }
            .id-sub { font-size: 6pt; margin: 0; font-weight: bold; }
            .id-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
            .id-name { font-size: 11pt; font-weight: bold; margin: 0; line-height: 1.1; }
            .id-chest { font-size: 14pt; font-weight: 900; font-family: 'Outfit', sans-serif; margin: 2px 0; }
            .id-team { font-size: 7pt; font-weight: bold; background: #eee !important; padding: 2px 4px; border-radius: 4px; display: inline-block; margin: 0 auto; }
            .id-footer { font-size: 6pt; border-top: 1px solid #ccc; padding-top: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-gray-900 to-zinc-900 min-h-screen">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Print Area -->
    <div id="print-area"></div>

    <!-- Edit Candidate Modal -->
    <div id="editCandModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-sky-500/30">
            <h3 class="text-lg font-bold text-sky-400 mb-4 border-b border-slate-700 pb-2">Edit Candidate</h3>
            <form id="editCandForm" onsubmit="saveEditCand(event)" class="space-y-3">
                <input type="hidden" id="editCandId">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label>
                    <input type="text" id="editCandName" required class="w-full bg-black/80 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Chest No</label>
                    <input type="text" id="editCandRegNo" required class="w-full bg-black/80 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm font-mono">
                </div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" onclick="document.getElementById('editCandModal').style.display='none'" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm border border-slate-600">Cancel</button>
                    <button type="submit" id="saveEditCandBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assign Programs Modal -->
    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">Assign Programs</h3>
            <p class="text-xs text-sky-400 mb-2 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            
            <div id="limitsInfo" class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 flex justify-around mb-4 text-xs font-bold shadow-inner">
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Stage Used</span><span id="limitStage" class="text-sky-300 text-lg">0/0</span></div>
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Non-Stage Used</span><span id="limitNonStage" class="text-emerald-300 text-lg">0/0</span></div>
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">General Used</span><span id="limitGeneral" class="text-purple-300 text-lg">0</span></div>
            </div>

            <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="closeAssign()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button id="saveAssignBtn" onclick="saveAssign()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold transition shadow-lg">Save Selection</button>
            </div>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col">
        <div class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen relative" id="login-container">
            <div class="absolute inset-0 z-0 opacity-20 flex items-center justify-center pointer-events-none">
                <!-- Watermark / Background element -->
                <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/LOGO%204-01.png" alt="Background Element" class="w-full max-w-md object-contain mix-blend-screen">
            </div>
            <div class="glass-card max-w-sm w-full rounded-[2rem] p-8 shadow-2xl text-center relative z-10 border border-slate-700 bg-slate-900/90">
                <div class="flex flex-col items-center justify-center mb-6">
                    <!-- Main Requested Logo for Login Screen -->
                    <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261008_191200.png" alt="Urava Logo Main" class="w-32 h-auto mb-4 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] rounded-2xl">
                    <span class="text-[10px] text-sky-400 font-extrabold tracking-widest uppercase mb-1">Aawaaze Funoon Season 04</span>
                    <h2 class="text-xl font-black text-slate-200 tracking-tight">FEST MANAGER</h2>
                    <div class="flex gap-2 mt-3 justify-center">
                        <span class="text-[10px] bg-sky-900/80 text-sky-200 px-3 py-1 rounded-full font-bold border border-sky-700 shadow">Al-Masūdi</span>
                        <span class="text-[10px] bg-emerald-900/80 text-emerald-200 px-3 py-1 rounded-full font-bold border border-emerald-700 shadow">Al-Qazwini</span>
                    </div>
                </div>
                <form onsubmit="event.preventDefault(); if(window.handleLogin) window.handleLogin(event); else alert('System initializing... Please wait.');" class="space-y-4">
                    <input type="password" id="loginPass" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-sky-500 text-center tracking-widest transition" placeholder="Enter Admin PIN">
                    <button type="submit" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-sky-900/50">Secure Login</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Updated Firebase Config for pullani-6a39b
        const firebaseConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8",
            measurementId: "G-DX50SRTWJS"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        // Strict Paths definition based on system rules
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'urava-s4-fest';
        const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
        const getDocRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

        // Constants - Removed Gender/Class concepts entirely
        const TEAMS = ['Al-Masūdi', 'Al-Qazwini'];
        const CANDIDATE_CATEGORIES = ['Junior', 'Senior']; 
        const PROGRAM_CATEGORIES = ['Junior', 'Senior', 'General'];
        const ADMIN_PASSWORD = "admin";

        // State
        let isAuthStatus = false;
        try { isAuthStatus = sessionStorage.getItem('admin_auth') === 'true'; } catch(e) {}

        let state = {
            isAuthenticated: isAuthStatus,
            tab: 'dashboard', 
            candidates: [], 
            programs: [], 
            results: [],
            searchQuery: '', searchProgQuery: '', searchResQuery: '',
            filterTeam: 'All', filterCat: 'All', filterResultCat: 'All'
        };
        window.state = state;

        window.updateSearch = (val) => { state.searchQuery = val; window.render(); const s = document.getElementById('searchInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };
        window.updateProgSearch = (val) => { state.searchProgQuery = val; window.render(); const s = document.getElementById('searchProgInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };
        window.updateResSearch = (val) => { state.searchResQuery = val; window.render(); const s = document.getElementById('searchResInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };

        window.fireConfetti = () => {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#38bdf8', '#34d399', '#f8fafc', '#818cf8'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#38bdf8', '#34d399', '#f8fafc', '#818cf8'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        };

        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast'); 
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-slate-900/95 border border-red-500/50 text-red-200' : 'bg-slate-900/95 border border-sky-500/50 text-sky-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 4000); 
        };

        const initDB = async () => {
            try { 
                // Using custom Firebase project, so we must use Anonymous Auth.
                // You MUST enable "Anonymous" in Firebase Console -> Authentication -> Sign-in methods
                await signInAnonymously(auth); 
            } catch (e) { 
                console.error("Auth Error:", e);
                window.showAlert("DB Auth Error: Please enable 'Anonymous' Sign-in in Firebase.", "error"); 
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(getDocRef('settings', 'config'), (snap) => {
                    if (snap.exists()) { state.programs = snap.data().programs || []; } 
                    else { setDoc(getDocRef('settings', 'config'), { programs: [] }).catch(e=>{}); }
                    if(state.isAuthenticated) window.render();
                }, (err) => console.error(err));

                onSnapshot(getCol('candidates'), (snap) => {
                    state.candidates = snap.docs.map(d => ({ id: d.id, assignedPrograms: [], ...d.data() }));
                    if(state.isAuthenticated) window.render();
                }, (err) => console.error(err));

                onSnapshot(getCol('results'), (snap) => {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(state.isAuthenticated) window.render();
                }, (err) => console.error(err));
            }
        });
        
        initDB(); 

        window.handleLogin = (e) => {
            e.preventDefault();
            if (document.getElementById('loginPass').value === ADMIN_PASSWORD) {
                state.isAuthenticated = true; try { sessionStorage.setItem('admin_auth', 'true'); } catch(e){}
                window.showAlert("Login Successful!"); window.render(); 
            } else { window.showAlert("Incorrect PIN!", "error"); }
        };

        window.handleLogout = () => { state.isAuthenticated = false; try { sessionStorage.removeItem('admin_auth'); } catch(e){} window.render(); };
        window.switchTab = (tab) => { state.tab = tab; window.render(); };

        const generateProgramNo = () => {
            const count = state.programs.length + 1;
            return 'BDF' + String(count).padStart(4, '0');
        };

        const generateChestNo = (category) => {
            const catCands = state.candidates.filter(c => c.cat === category);
            let prefix = category === 'Junior' ? 'J' : 'S';
            let max = 100;
            catCands.forEach(c => {
                const num = parseInt(c.regNo.replace(/\D/g, ''));
                if (!isNaN(num) && num > max) max = num;
            });
            return prefix + (max + 1);
        };

        // Programs CRUD
        window.addNewProgram = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('pName').value; 
            const cat = document.getElementById('pCat').value; 
            const type = document.getElementById('pType').value; 
            const pointScheme = document.getElementById('pPoints').value; 
            const kalaprathiba = document.getElementById('pKalaprathiba').value === "true";
            const progNo = generateProgramNo();
            
            const newProg = { id: 'p' + Date.now(), progNo, name, cat, type, pointScheme, kalaprathiba, timestamp: Date.now() }; 
            const updatedProgs = [...state.programs, newProg]; 
            
            const btn = document.getElementById('addProgBtn'); btn.disabled = true; btn.innerText = 'Wait...';
            try { 
                await updateDoc(getDocRef('settings', 'config'), { programs: updatedProgs }); 
                window.showAlert(`Program Added (${progNo})`); e.target.reset(); 
            } catch(err) { window.showAlert("Error: " + err.message, "error"); }
            finally { btn.disabled = false; btn.innerText = '+ Add Program'; }
        };

        window.deleteProgram = async (id) => {
            if(confirm("Delete this program? This cannot be undone.")) {
                const updatedProgs = state.programs.filter(p => p.id !== id); 
                try { await updateDoc(getDocRef('settings', 'config'), { programs: updatedProgs }); window.showAlert("Deleted!"); } 
                catch(e) { window.showAlert("Failed.", "error"); }
            }
        };

        // Candidates CRUD - Removed Class and Gender fields
        window.addCandidate = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('cName').value; 
            const cat = document.getElementById('cCat').value; 
            const team = document.getElementById('cTeam').value;
            const regNo = generateChestNo(cat);
            
            const btn = document.getElementById('addCandBtn'); btn.innerText = "Saving..."; btn.disabled = true; 
            try { 
                await addDoc(getCol('candidates'), { name, regNo: String(regNo), cat, team, assignedPrograms: [], timestamp: Date.now() }); 
                window.showAlert(`Added! Chest No: ${regNo}`); 
                e.target.reset(); 
                document.getElementById('cCat').value = cat; document.getElementById('cTeam').value = team;
            } catch (err) { window.showAlert("Error: " + err.message, "error"); } 
            finally { btn.innerText = "Save Candidate"; btn.disabled = false; } 
        };

        window.deleteCandidate = async (id) => {
            if(confirm("Delete this candidate?")) {
                try { await deleteDoc(getDocRef('candidates', id)); window.showAlert("Deleted."); } catch(e) { window.showAlert("Failed.", "error"); }
            }
        };

        window.openEditCand = (id) => {
            const c = state.candidates.find(x => x.id === id); if(!c) return;
            document.getElementById('editCandId').value = c.id;
            document.getElementById('editCandName').value = c.name;
            document.getElementById('editCandRegNo').value = c.regNo;
            document.getElementById('editCandModal').style.display = 'flex';
        };

        window.saveEditCand = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editCandId').value;
            const btn = document.getElementById('saveEditCandBtn'); btn.innerText = 'Saving...'; btn.disabled = true;
            try {
                await updateDoc(getDocRef('candidates', id), { name: document.getElementById('editCandName').value, regNo: document.getElementById('editCandRegNo').value });
                window.showAlert("Candidate updated!"); document.getElementById('editCandModal').style.display = 'none';
            } catch(err) { window.showAlert("Error.", "error"); }
            finally { btn.innerText = 'Update'; btn.disabled = false; }
        };

        let currentAssignCandidateId = null;
        
        window.getCategoryLimits = (cat) => {
            if (cat === 'Junior') return { stage: 5, nonStage: 4 };
            if (cat === 'Senior') return { stage: 5, nonStage: 5 };
            return { stage: 99, nonStage: 99 };
        };

        window.calculateUsage = (assignedArray) => {
            let usage = { stage: 0, nonStage: 0, general: 0 };
            assignedArray.forEach(pId => {
                const prog = state.programs.find(p => p.id === pId);
                if (prog) {
                    if (prog.cat === 'General' || prog.type === 'General') {
                        usage.general++;
                    } else {
                        if (prog.type === 'Stage') usage.stage++;
                        if (prog.type === 'Non-Stage') usage.nonStage++;
                    }
                }
            });
            return usage;
        };

        window.openAssign = (candId) => {
            const candidate = state.candidates.find(c => c.id === candId); if (!candidate) return; 
            currentAssignCandidateId = candId;
            
            document.getElementById('assignTitle').innerText = `Assign Programs to ${candidate.name}`; 
            document.getElementById('assignSubtitle').innerText = `#${candidate.regNo} • ${candidate.team} • ${candidate.cat}`;
            
            const eligibleProgs = state.programs.filter(p => p.cat === candidate.cat || p.cat === 'General'); 
            const assigned = candidate.assignedPrograms || [];
            
            renderAssignCheckboxes(candidate.cat, eligibleProgs, assigned);
            document.getElementById('assignModal').style.display = 'flex';
        };

        const renderAssignCheckboxes = (cat, eligibleProgs, assigned) => {
            const limits = window.getCategoryLimits(cat);
            const usage = window.calculateUsage(assigned);
            
            const sElem = document.getElementById('limitStage');
            sElem.innerText = `${usage.stage}/${limits.stage}`;
            sElem.className = usage.stage >= limits.stage ? "text-red-400 text-lg font-black" : "text-sky-300 text-lg";

            const nsElem = document.getElementById('limitNonStage');
            nsElem.innerText = `${usage.nonStage}/${limits.nonStage}`;
            nsElem.className = usage.nonStage >= limits.nonStage ? "text-red-400 text-lg font-black" : "text-emerald-300 text-lg";

            document.getElementById('limitGeneral').innerText = usage.general;

            let html = '';
            eligibleProgs.forEach(p => {
                const isChecked = assigned.includes(p.id);
                
                let isDisabled = false;
                if (!isChecked && p.cat !== 'General' && p.type !== 'General') {
                    if (p.type === 'Stage' && usage.stage >= limits.stage) isDisabled = true;
                    if (p.type === 'Non-Stage' && usage.nonStage >= limits.nonStage) isDisabled = true;
                }

                html += `<label class="flex items-center justify-between p-3 bg-slate-800/50 border border-slate-700 rounded-lg cursor-pointer hover:bg-slate-700/50 transition ${isDisabled ? 'opacity-50 cursor-not-allowed' : ''}">
                    <div>
                        <span class="text-white text-sm font-semibold block ${isDisabled ? 'line-through text-slate-500' : ''}">
                            <span class="text-sky-400 mr-1">#${p.progNo}</span>${p.name}
                        </span>
                        <span class="text-[10px] ${(p.cat==='General' || p.type==='General') ? 'text-purple-400' : 'text-slate-400'} uppercase font-bold tracking-wider">${p.cat} • ${p.type}</span>
                    </div>
                    <input type="checkbox" value="${p.id}" onchange="window.handleCheckboxChange(this)" class="prog-checkbox w-5 h-5 accent-sky-500 rounded" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                </label>`;
            });
            document.getElementById('assignCheckboxes').innerHTML = html;
        };

        window.handleCheckboxChange = (cb) => {
            const candidate = state.candidates.find(c => c.id === currentAssignCandidateId);
            const eligibleProgs = state.programs.filter(p => p.cat === candidate.cat || p.cat === 'General');
            const checkboxes = document.querySelectorAll('.prog-checkbox');
            const selectedProgs = Array.from(checkboxes).filter(chk => chk.checked).map(chk => chk.value);
            renderAssignCheckboxes(candidate.cat, eligibleProgs, selectedProgs);
        };

        window.closeAssign = () => { document.getElementById('assignModal').style.display = 'none'; currentAssignCandidateId = null; };

        window.saveAssign = async () => {
            if (!currentAssignCandidateId) return;
            const checkboxes = document.querySelectorAll('.prog-checkbox');
            const selectedProgs = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
            
            const btn = document.getElementById('saveAssignBtn'); btn.innerText = 'Saving...'; btn.disabled = true;
            try { 
                await updateDoc(getDocRef('candidates', currentAssignCandidateId), { assignedPrograms: selectedProgs }); 
                window.showAlert("Saved!"); closeAssign(); 
            } catch (e) { window.showAlert("Error saving", "error"); } 
            finally { btn.innerText = 'Save Selection'; btn.disabled = false; }

                    for(const c of data.candidates) { await setDoc(getDocRef('candidates', c.id), c); }
                    for(const r of data.results) { await setDoc(getDocRef('results', r.id), r); }

                            <form onsubmit="window.addNewProgram(event)" class="flex flex-wrap gap-3 items-end">
                                <div class="flex-1 min-w-[150px]"><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Name</label><input type="text" id="pName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 text-sm"></div>
                                <div><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Cat</label><select id="pCat" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-white outline-none text-sm">${PROGRAM_CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Type</label>
                                    <select id="pType" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-white outline-none text-sm">
                                        <option value="Stage">Stage</option>
                                        <option value="Non-Stage">Non-Stage</option>
                                        <option value="General">General</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Pts</label>
                                    <select id="pPoints" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-emerald-300 font-bold outline-none text-sm">
                                        <option value="10,5,3">10,5,3 (Individual)</option>
                                        <option value="15,8,5">15,8,5 (Group)</option>
                                    </select>
                                </div>
                                <div><label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Kala?</label><select id="pKalaprathiba" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-yellow-300 font-bold outline-none text-sm"><option value="true">Yes</option><option value="false">No</option></select></div>
                                <button type="submit" id="addProgBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg transition text-sm">+ Add</button>
                            </form>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
                        
                    PROGRAM_CATEGORIES.forEach(cat => {
                        const progs = state.programs.filter(p => p.cat === cat && (!searchPQ || p.name.toLowerCase().includes(searchPQ) || p.progNo.toLowerCase().includes(searchPQ)));
                        if(progs.length === 0) return;
                        
                        mainContent += `
                            <div class="glass-card p-4 rounded-2xl h-fit border-t border-slate-700">
                                <h4 class="font-bold text-sm mb-3 text-slate-300 border-b border-slate-700 pb-2">${cat} Programs</h4>
                                <div class="space-y-2">
                                    ${progs.map(p => `
                                        <div class="bg-slate-800/60 p-3 rounded-lg border border-slate-700 flex justify-between items-start group">
                                            <div>
                                                <div class="text-white text-sm font-semibold leading-tight"><span class="text-sky-400 font-mono text-xs mr-1">#${p.progNo}</span>${p.name}</div>
                                                <div class="text-[9px] font-bold text-slate-400 uppercase mt-1 tracking-wider">${p.type} • ${p.pointScheme} • ${p.kalaprathiba ? '⭐' : '🚫'}</div>
                                            </div>
                                            <button onclick="window.deleteProgram('${p.id}')" class="text-red-400 text-xs opacity-0 group-hover:opacity-100 transition">✕</button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>`;
                    });
                    mainContent += `</div>`;
                }

                if (state.tab === 'results') {
                    const searchRQ = state.searchResQuery.toLowerCase();
                    const sortedResults = [...state.results]
                        .filter(res => {
                            const prog = state.programs.find(p => p.id === res.progId);
                            if(!prog) return true;
                            if (searchRQ && !prog.name.toLowerCase().includes(searchRQ) && !prog.progNo.toLowerCase().includes(searchRQ)) return false;
                            if (state.filterResultCat !== 'All' && prog.cat !== state.filterResultCat) return false;
                            return true;
                        }).sort((a, b) => b.timestamp - a.timestamp);

                    mainContent = `
                        <div class="flex flex-col lg:flex-row gap-6 mt-4">
                            <div class="w-full lg:w-1/3">
                                <div class="glass-card p-5 rounded-2xl border border-sky-500/30">
                                    <h3 class="font-bold text-sky-400 mb-4">Publish Result</h3>
                                    <form onsubmit="window.publishResult(event)">
                                        <select id="rProg" onchange="window.populateResultDropdowns()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-400 text-sm mb-3">
                                            <option value="">-- Select Program --</option>
                                            ${[...state.programs].filter(p => !state.results.find(r => r.progId === p.id)).map(p => `<option value="${p.id}">#${p.progNo} - ${p.name} (${p.cat})</option>`).join('')}
                                        </select>
                                        <div id="rSelectors"></div>
                                    </form>
                                </div>
                            </div>
                            
                            <div class="w-full lg:w-2/3 glass-card p-5 rounded-2xl flex flex-col h-[700px] border-t border-slate-700">
                                <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                                    <h3 class="font-bold text-white">Published Results</h3>
                                    <div class="flex gap-2">
                                        <input type="text" id="searchResInput" placeholder="Search..." value="${state.searchResQuery}" oninput="window.updateResSearch(this.value)" class="bg-slate-900 border border-slate-700 text-xs text-white rounded-lg px-3 py-1.5 outline-none w-32">
                                        <select onchange="window.state.filterResultCat = this.value; window.render();" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2 py-1.5 outline-none">
                                            <option value="All">All Cats</option>${PROGRAM_CATEGORIES.map(c => `<option value="${c}" ${state.filterResultCat===c?'selected':''}>${c}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                <div class="overflow-y-auto flex-1 pr-2 space-y-3 custom-scrollbar">
                                    ${sortedResults.length === 0 ? `<div class="text-center p-8 text-slate-500 text-sm">No results published yet.</div>` : ''}
                                    ${sortedResults.map(res => {
                                        const prog = state.programs.find(p => p.id === res.progId);
                                        return `
                                        <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl relative">
                                            <button onclick="window.deleteResult('${res.id}')" class="absolute top-3 right-3 text-red-400 hover:text-white bg-slate-900 px-2 py-1 rounded text-[10px] font-bold border border-red-500/30">Delete</button>
                                            <h4 class="font-bold text-white text-base mb-3 pr-16">${prog ? `<span class="text-sky-400">#${prog.progNo}</span> ${prog.name} <span class="text-[9px] text-slate-400 uppercase ml-1">${prog.cat}</span>` : 'Unknown Program'}</h4>
                                            <div class="space-y-1.5">
                                                ${getNamesBadgeHtml(res.first, 'border-yellow-500/30', 'text-yellow-400', '🥇')}
                                                ${getNamesBadgeHtml(res.second, 'border-slate-400/30', 'text-slate-300', '🥈')}
                                                ${getNamesBadgeHtml(res.third, 'border-amber-600/30', 'text-amber-500', '🥉')}
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>`;
                }

                if (state.tab === 'settings') {
                    mainContent = `
                        <div class="max-w-2xl mx-auto mt-8 space-y-6">
                            <div class="glass-card p-6 rounded-2xl border border-slate-700">
                                <h3 class="font-bold text-white text-lg mb-4 flex items-center gap-2">💾 Database Backup & Export</h3>
                                <p class="text-sm text-slate-400 mb-6">Securely download your entire fest database as a JSON file, or export candidates to a CSV spreadsheet.</p>
                                <div class="flex flex-wrap gap-4">
                                    <button onclick="window.exportData()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-3 rounded-xl font-bold shadow-lg transition">Download Full Backup (JSON)</button>
                                    <button onclick="window.exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold shadow-lg transition">Export Candidates (CSV)</button>
                                </div>
                            </div>

                            <div class="glass-card p-6 rounded-2xl border border-slate-700">
                                <h3 class="font-bold text-white text-lg mb-4 flex items-center gap-2">📥 Restore Database</h3>
                                <p class="text-sm text-slate-400 mb-4">Restore a previously downloaded JSON backup file. This will overwrite current matching records.</p>
                                <input type="file" id="importFile" accept=".json" class="hidden" onchange="window.handleImport(event)">
                                <button onclick="window.triggerImport()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-xl font-bold transition border border-slate-600">Select Backup File to Import</button>
                            </div>

                            <div class="glass-card p-6 rounded-2xl border border-red-500/30 bg-red-950/20">
                                <h3 class="font-bold text-red-400 text-lg mb-2 flex items-center gap-2">⚠️ Danger Zone</h3>
                                <p class="text-sm text-red-300/70 mb-4">Wipe all data completely to start a new fest. This cannot be undone without a backup.</p>
                                <button onclick="window.wipeDatabase()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition text-sm">Wipe Entire Database</button>
                            </div>
                        </div>
                    `;
                }

                // Header HTML wrapping with custom small text logo
                app.innerHTML = `
                    <header class="bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 p-3 px-4 sm:px-6 flex justify-between items-center z-50">
                        <div class="flex items-center gap-3">
                            <img src="https://raw.githubusercontent.com/BUSA2023/Kottam-admin/main/20261008_183322.png" alt="Logo" class="h-10 w-auto object-contain drop-shadow-md">
                            <div>
                                <h1 class="text-white text-base sm:text-xl tracking-tight leading-none mb-0.5 font-bold">Aawaaze Funoon</h1>
                                <p class="text-[9px] text-sky-400 font-bold uppercase tracking-widest">Season 04 • Fest Manager</p>
                            </div>
                        </div>
                        <button onclick="window.handleLogout()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold border border-slate-600 transition">Logout</button>
                    </header>
                    ${navHtml}
                    <main class="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto pb-10">
                        ${mainContent}
                    </main>
                `;
            } catch(e) {
                console.error("Rendering Error:", e);
                document.getElementById('app').innerHTML = `<div class="p-10 text-white text-center bg-red-900 min-h-screen"><h1 class="text-xl font-bold">Error Rendering UI</h1><p>${e.message}</p></div>`;
            }
        };
        
        // Ensure UI draws immediately
        window.render();
    </script>
</body>
</html>
