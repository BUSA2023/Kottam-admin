<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ലദൽ മദീന 2K26 - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #2e1065; color: #f8fafc; overflow-x: hidden; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .tab-active { border-bottom: 3px solid #fbbf24; color: #fbbf24; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #ddd6fe; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e0048; }
        ::-webkit-scrollbar-thumb { background: #5b21b6; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #7c3aed; }
        .glass-card { background: rgba(15, 3, 25, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fbbf24' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 0.9em; padding-right: 2.2rem !important; }
        select option { background-color: #1e0048; color: #f8fafc; }
        select optgroup { background-color: #3b0764; color: #fbbf24; font-style: normal; font-weight: bold; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-950 via-slate-950 to-indigo-950 min-h-screen">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Modals -->
    <div id="editCandModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-amber-500/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4 border-b border-purple-800 pb-2">Edit Candidate</h3>
            <form id="editCandForm" onsubmit="saveEditCand(event)" class="space-y-3">
                <input type="hidden" id="editCandId">
                <div>
                    <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Name</label>
                    <input type="text" id="editCandName" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Chest No</label>
                        <input type="text" id="editCandRegNo" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Class & Div</label>
                        <input type="text" id="editCandClassDiv" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                    </div>
                </div>
                <div class="flex gap-3 justify-end pt-4">
                    <button type="button" onclick="document.getElementById('editCandModal').style.display='none'" class="px-4 py-2 bg-purple-950 text-white rounded-lg text-sm border border-purple-700">Cancel</button>
                    <button type="submit" id="saveEditCandBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editProgModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-amber-500/30">
            <h3 class="text-lg font-bold text-amber-400 mb-4 border-b border-purple-800 pb-2">Edit Program Settings</h3>
            <form id="editProgForm" onsubmit="saveEditProg(event)" class="space-y-3">
                <input type="hidden" id="editProgId">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Prog No</label>
                        <input type="text" id="editProgNo" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm font-mono">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Name</label>
                        <input type="text" id="editProgName" required class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Category</label>
                        <select id="editProgCat" class="w-full bg-black/80 border border-purple-800 rounded-lg px-2 py-2 text-white outline-none focus:border-amber-500 text-xs">
                            <option value="Kiddies">Kiddies</option>
                            <option value="Sub Junior">Sub Junior</option>
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                            <option value="Super Senior">Super Senior</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Gender</label>
                        <select id="editProgGender" class="w-full bg-black/80 border border-purple-800 rounded-lg px-2 py-2 text-white outline-none focus:border-amber-500 text-xs">
                            <option value="ALL">Boys & Girls</option>
                            <option value="BOYS">Boys Only</option>
                            <option value="GIRLS">Girls Only</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Type</label>
                        <select id="editProgType" class="w-full bg-black/80 border border-purple-800 rounded-lg px-2 py-2 text-white outline-none focus:border-amber-500 text-xs">
                            <option value="Stage">Stage</option>
                            <option value="Non-Stage">Non-Stage</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-purple-300 uppercase mb-1">Format (Points System)</label>
                    <select id="editProgFormat" class="w-full bg-black/80 border border-purple-800 rounded-lg px-3 py-2 text-white outline-none focus:border-amber-500 text-sm">
                        <option value="Individual">Individual (5, 3, 1 Pts)</option>
                        <option value="Group">Group Event (10, 5, 3 Pts)</option>
                    </select>
                </div>
                <div class="flex gap-3 justify-end pt-4 border-t border-purple-800 mt-2">
                    <button type="button" onclick="document.getElementById('editProgModal').style.display='none'" class="px-4 py-2 bg-purple-950 text-white rounded-lg text-sm border border-purple-700">Cancel</button>
                    <button type="submit" id="saveEditProgBtn" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-black rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">മത്സരങ്ങൾ ചേർക്കുക</h3>
            <p class="text-xs text-amber-400 mb-4 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            <div class="bg-purple-950/60 border border-purple-800 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="closeAssign()" class="px-4 py-2 bg-purple-950 hover:bg-purple-900 text-white rounded-lg text-sm font-semibold transition border border-purple-700">റദ്ദാക്കുക</button>
                <button id="saveAssignBtn" onclick="saveAssign()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg text-sm font-semibold transition shadow-lg">സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <div id="enrolledModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-lg font-bold text-white" id="enrolledTitle">രജിസ്റ്റർ ചെയ്തവർ</h3>
                <button onclick="closeEnrolled()" class="text-purple-300 hover:text-white bg-purple-950 hover:bg-purple-900 rounded-full w-8 h-8 flex items-center justify-center transition">✕</button>
            </div>
            <p class="text-xs text-amber-300 mb-4 font-bold tracking-widest uppercase" id="enrolledSubtitle"></p>
            <div class="bg-purple-950/60 border border-purple-800 rounded-xl p-4 flex-1 overflow-y-auto custom-scrollbar">
                <div id="enrolledList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app" class="min-h-screen flex flex-col"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo3S007XNUl1bAfgAlMR1vJyDQBNFf6MI",
            authDomain: "kottam-eee89.firebaseapp.com",
            projectId: "kottam-eee89",
            storageBucket: "kottam-eee89.firebasestorage.app",
            messagingSenderId: "558082092753",
            appId: "1:558082092753:web:c0a69f647998061a3adff0"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        const TEAMS = ['KHAIBAR WARRIORS', 'KHANDAQ FIGHTERS'];
        const DIVISIONS = ['BOYS', 'GIRLS'];
        const CATEGORIES = ['Kiddies', 'Sub Junior', 'Junior', 'Senior', 'Super Senior'];
        const CAT_PREFIX = { 'Kiddies': 'K', 'Sub Junior': 'SJ', 'Junior': 'J', 'Senior': 'S', 'Super Senior': 'SS' };
        
        const ADMIN_PASSWORD = "admin";

        // Global state
        let state = {
            isAuthenticated: sessionStorage.getItem('admin_auth') === 'true',
            tab: 'dashboard', 
            candidates: [], 
            programs: [], 
            results: [],
            searchQuery: '',
            searchProg: '',
            searchResult: '',
            filterTeam: 'All',
            filterGender: 'All',
            filterCat: 'All',
            filterResultGender: 'All'
        };
        window.state = state;

        // Auto-detect group events
        window.isGroupProgram = (name, forceIsGroup) => {
            if (forceIsGroup !== undefined) return forceIsGroup;
            if (!name) return false;
            const n = name.toLowerCase();
            return n.includes('group') || n.includes('burda') || n.includes('burdha') || n.includes('qawwali') || n.includes('mala') || n.includes('mash up') || n.includes('moulid') || n.includes('padappayatt') || n.includes('newspaper') || n.includes('collage');
        };

        window.updateSearch = (val, type) => {
            if(type === 'cand') state.searchQuery = val;
            if(type === 'prog') state.searchProg = val;
            if(type === 'res') state.searchResult = val;
            window.render();
            // Restore focus
            const inputIds = {'cand':'searchInput', 'prog':'searchProgInput', 'res':'searchResInput'};
            const searchEl = document.getElementById(inputIds[type]);
            if (searchEl) {
                searchEl.focus();
                searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
            }
        };

        window.fireConfetti = () => {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#fbbf24', '#c084fc', '#f59e0b', '#a855f7'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fbbf24', '#c084fc', '#f59e0b', '#a855f7'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        };

        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast'); 
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-purple-950/90 border border-red-500/50 text-red-200' : 'bg-purple-950/90 border border-amber-500/50 text-amber-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 5000); 
        };

        // DB Init
        const initDB = async () => {
            try { await signInAnonymously(auth); } 
            catch (e) { console.error("Login Failed:", e); window.showAlert("DB Auth Error", "error"); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, 'settings', 'config'), (snap) => {
                    if (snap.exists()) { state.programs = snap.data().programs || []; } 
                    else { setDoc(doc(db, 'settings', 'config'), { programs: [] }).catch(e=>{}); }
                    if(state.isAuthenticated) render();
                });
                onSnapshot(collection(db, 'candidates'), (snap) => {
                    state.candidates = snap.docs.map(d => ({ id: d.id, assignedPrograms: [], ...d.data() }));
                    if(state.isAuthenticated) render();
                });
                onSnapshot(collection(db, 'results'), (snap) => {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    if(state.isAuthenticated) render();
                });
            }
        });
        
        initDB(); 
        render();

        window.handleLogin = (e) => {
            e.preventDefault();
            if (document.getElementById('loginPass').value === ADMIN_PASSWORD) {
                state.isAuthenticated = true; sessionStorage.setItem('admin_auth', 'true');
                window.showAlert("ലോഗിൻ വിജയകരം!"); render(); 
            } else { window.showAlert("തെറ്റായ പാസ്സ്‌വേർഡ്!", "error"); }
        };

        window.handleLogout = () => { state.isAuthenticated = false; sessionStorage.removeItem('admin_auth'); render(); };
        window.switchTab = (tab) => { state.tab = tab; render(); };

        window.addNewProgram = async (e) => {
            e.preventDefault(); 
            const progNo = document.getElementById('pNo').value;
            const name = document.getElementById('pName').value; 
            const cat = document.getElementById('pCat').value; 
            const type = document.getElementById('pType').value; 
            
            const newProg = { id: 'p' + Date.now(), progNo, name, cat, type, timestamp: Date.now() }; 
            const updatedProgs = [...state.programs, newProg]; 
            
            const btn = document.getElementById('addProgBtn'); btn.disabled = true; btn.innerText = 'Saving...';
            try { await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs }); window.showAlert("മത്സരം ചേർത്തു!"); e.target.reset(); } 
            catch(err) { window.showAlert("Error: " + err.message, "error"); }
            finally { btn.disabled = false; btn.innerText = '+ ചേർക്കുക'; }
        };

        window.deleteProgram = async (id) => {
            if(confirm("ഈ മത്സരം പൂർണ്ണമായി ഡിലീറ്റ് ചെയ്യണോ?")) {
                const updatedProgs = state.programs.filter(p => p.id !== id); 
                try { await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs }); window.showAlert("ഡിലീറ്റ് ചെയ്തു!"); } 
                catch(e) { window.showAlert("പരാജയപ്പെട്ടു.", "error"); }
            }
        };

        window.openEditProg = (id) => {
            const p = state.programs.find(x => x.id === id); if(!p) return;
            document.getElementById('editProgId').value = p.id;
            document.getElementById('editProgNo').value = p.progNo || '';
            document.getElementById('editProgName').value = p.name;
            document.getElementById('editProgCat').value = p.cat;
            document.getElementById('editProgType').value = p.type || 'Stage';
            document.getElementById('editProgGender').value = p.gender || 'ALL';
            
            const isGrp = window.isGroupProgram(p.name, p.isGroup);
            document.getElementById('editProgFormat').value = isGrp ? 'Group' : 'Individual';
            
            document.getElementById('editProgModal').style.display = 'flex';
        };

        window.saveEditProg = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editProgId').value;
            const btn = document.getElementById('saveEditProgBtn'); btn.innerText = 'Saving...'; btn.disabled = true;
            try {
                let updated = state.programs.map(p => p.id === id ? { 
                    ...p, 
                    progNo: document.getElementById('editProgNo').value, 
                    name: document.getElementById('editProgName').value,
                    cat: document.getElementById('editProgCat').value,
                    gender: document.getElementById('editProgGender').value,
                    type: document.getElementById('editProgType').value,
                    isGroup: document.getElementById('editProgFormat').value === 'Group'
                } : p);
                await updateDoc(doc(db, 'settings', 'config'), { programs: updated });
                window.showAlert("Program updated!"); document.getElementById('editProgModal').style.display = 'none';
            } catch(err) { window.showAlert("Error: " + err.message, "error"); }
            finally { btn.innerText = 'Update'; btn.disabled = false; }
        };

        window.addCandidate = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('cName').value; 
            const cat = document.getElementById('cCat').value; 
            const team = document.getElementById('cTeam').value;
            const gender = document.getElementById('cGender').value;
            const classDiv = document.getElementById('cClassDiv').value || '-'; 
            let regNo = document.getElementById('cRegNo').value; 
            
            if(!regNo) {
                const prefix = CAT_PREFIX[cat] || 'K'; 
                const catCount = state.candidates.filter(c => c.cat === cat).length; 
                regNo = prefix + (101 + catCount); 
            }
            
            const btn = document.getElementById('addCandBtn'); btn.innerText = "Saving..."; btn.disabled = true; 
            
            try { 
                await addDoc(collection(db, 'candidates'), { 
                    name, regNo: String(regNo), classDiv, cat, team, gender,
                    assignedPrograms: [], timestamp: Date.now() 
                }); 
                window.showAlert(`കുട്ടിയെ ചേർത്തു! (Chest No: ${regNo})`); 
                e.target.reset(); 
                document.getElementById('cCat').value = cat; document.getElementById('cTeam').value = team; document.getElementById('cGender').value = gender;
            } catch (err) { window.showAlert("Error: " + err.message, "error"); } 
            finally { btn.innerText = "സേവ് ചെയ്യുക"; btn.disabled = false; } 
        };

        window.deleteCandidate = async (id) => {
            if(confirm("ഈ കുട്ടിയെ ഡിലീറ്റ് ചെയ്യണോ?")) {
                try { await deleteDoc(doc(db, 'candidates', id)); window.showAlert("ഡിലീറ്റ് ചെയ്തു."); } 
                catch(e) { window.showAlert("പരാജയപ്പെട്ടു.", "error"); }
            }
        };

        window.openEditCand = (id) => {
            const c = state.candidates.find(x => x.id === id); if(!c) return;
            document.getElementById('editCandId').value = c.id;
            document.getElementById('editCandName').value = c.name;
            document.getElementById('editCandRegNo').value = c.regNo;
            document.getElementById('editCandClassDiv').value = c.classDiv || '';
            document.getElementById('editCandModal').style.display = 'flex';
        };

        window.saveEditCand = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editCandId').value;
            const btn = document.getElementById('saveEditCandBtn'); btn.innerText = 'Saving...'; btn.disabled = true;
            try {
                await updateDoc(doc(db, 'candidates', id), {
                    name: document.getElementById('editCandName').value,
                    regNo: document.getElementById('editCandRegNo').value,
                    classDiv: document.getElementById('editCandClassDiv').value
                });
                window.showAlert("Candidate updated!"); document.getElementById('editCandModal').style.display = 'none';
            } catch(err) { window.showAlert("Error: " + err.message, "error"); }
            finally { btn.innerText = 'Update'; btn.disabled = false; }
        };

        let currentAssignCandidateId = null;
        window.openAssign = (candId) => {
            const candidate = state.candidates.find(c => c.id === candId); if (!candidate) return; currentAssignCandidateId = candId;
            document.getElementById('assignTitle').innerText = `മത്സരങ്ങൾ ചേർക്കുക`; 
            document.getElementById('assignSubtitle').innerText = `${candidate.name} (#${candidate.regNo}) • ${candidate.team || ''} (${candidate.gender || ''})`;
            const eligibleProgs = state.programs.filter(p => p.cat === candidate.cat || p.cat === 'General'); const assigned = candidate.assignedPrograms || [];

            let html = '';
            if(eligibleProgs.length === 0) html = '<p class="text-purple-300 text-sm">ഈ വിഭാഗത്തിൽ മത്സരങ്ങൾ ചേർത്തിട്ടില്ല.</p>';
            
            eligibleProgs.forEach(p => {
                const isChecked = assigned.includes(p.id) ? 'checked' : '';
                html += `<label class="flex items-center justify-between p-3 bg-purple-900/50 border border-purple-700/60 rounded-lg cursor-pointer hover:bg-purple-800 transition">
                    <div>
                        <span class="text-white text-sm font-semibold block">${p.progNo ? `<span class="text-amber-500 mr-1">#${p.progNo}</span>` : ''}${p.name}</span>
                        <span class="text-[10px] text-amber-300 uppercase">${p.cat} • ${p.type}</span>
                    </div>
                    <input type="checkbox" value="${p.id}" class="prog-checkbox w-5 h-5 accent-amber-500 rounded" ${isChecked}>
                </label>`;
            });

                <main class="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto pb-10">
                    ${mainContent}
                </main>
            `;
        }

        window.render = render;
    </script>
</body>
