<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urava Season 04 - Fest Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .tab-active { border-bottom: 3px solid #38bdf8; color: #38bdf8; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #94a3b8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 0.9em; padding-right: 2.2rem !important; }
        select option { background-color: #0f172a; color: #f8fafc; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
            
            /* 3x3 Grid - 9 ID Cards per A4 Page */
            .id-card-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; padding: 5mm; width: 210mm; box-sizing: border-box; }
            .id-card { 
                height: 92mm; background: white !important; color: black !important; 
                border: 2px solid #0ea5e9; padding: 3mm; box-sizing: border-box; 
                display: flex; flex-direction: column; justify-content: space-between; 
                font-family: sans-serif; border-radius: 8px;
                page-break-inside: avoid;
            }
            .id-header { text-align: center; border-bottom: 2px solid #0ea5e9; padding-bottom: 2px; margin-bottom: 2px; }
            .id-title { font-size: 10pt; font-weight: 900; margin: 0; color: #0284c7 !important; text-transform: uppercase; }
            .id-sub { font-size: 6pt; margin: 0; font-weight: bold; }
            .id-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; overflow: hidden; }
            .id-name { font-size: 11pt; font-weight: bold; margin: 0; line-height: 1.1; max-height: 2.5em; overflow: hidden; }
            .id-chest { font-size: 16pt; font-weight: 900; margin: 2px 0; color: #0f172a !important; }
            .id-team { font-size: 8pt; font-weight: bold; background: #e2e8f0 !important; padding: 2px 4px; border-radius: 4px; display: inline-block; margin: 0 auto; }
            .id-footer { font-size: 6pt; border-top: 1px dashed #cbd5e1; padding-top: 2px; text-align: center; max-height: 20mm; overflow: hidden; color: #475569 !important; }
            
            /* Program Participant List Print */
            .print-prog-page { width: 210mm; background: white !important; color: black !important; padding: 10mm; font-family: sans-serif; box-sizing: border-box; }
            .print-prog-page h1 { text-align: center; font-size: 18pt; margin-bottom: 5px; color: #0f172a !important; font-weight: bold; }
            .print-prog-page h3 { text-align: center; font-size: 10pt; margin-top: 0; color: #475569 !important; text-transform: uppercase; letter-spacing: 1px; }
            .print-prog-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 10pt; }
            .print-prog-table th, .print-prog-table td { border: 1px solid #94a3b8; padding: 8px; text-align: left; }
            .print-prog-table th { background-color: #f1f5f9 !important; text-align: center; font-weight: bold; }

            /* A4 Vertical Certificates */
            .cert-page { 
                width: 210mm; height: 297mm; page-break-after: always; position: relative; 
                background: white !important; color: black !important; overflow: hidden; 
                box-sizing: border-box; padding: 20mm; font-family: 'Anek Malayalam', sans-serif; 
                display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
            }
            .cert-border { position: absolute; top: 12mm; bottom: 12mm; left: 12mm; right: 12mm; border: 5px double #0ea5e9; border-radius: 15px; z-index: -1; }
            .cert-logo { max-width: 160px; margin-bottom: 20px; object-fit: contain; }
            .cert-header { font-size: 32pt; font-weight: 900; color: #0284c7 !important; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-family: 'Outfit', sans-serif; }
            .cert-sub { font-size: 16pt; font-weight: bold; color: #334155 !important; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }
            .cert-text { font-size: 16pt; margin-bottom: 15px; color: #475569 !important; }
            .cert-name { font-size: 30pt; font-weight: bold; color: #0f172a !important; margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; width: 80%; margin-left: auto; margin-right: auto; }
            .cert-position { font-size: 24pt; font-weight: 900; color: #0284c7 !important; margin-top: 20px; margin-bottom: 10px; }
            .cert-prog { font-size: 20pt; font-weight: bold; color: #1e293b !important; margin-bottom: 50px; }
            .cert-signatures { display: flex; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 50px; }
            .cert-sig-block { text-align: center; border-top: 1px solid black; width: 200px; padding-top: 5px; font-weight: bold; font-size: 12pt; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-sky-950 to-slate-900 min-h-screen">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[400] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-sky-500/30 text-center">
            <h3 class="text-xl font-bold text-white mb-2" id="confirmTitle">Confirm</h3>
            <p class="text-sm text-slate-300 mb-6" id="confirmMsg">Are you sure?</p>
            <div class="flex gap-3 justify-center">
                <button id="confirmCancelBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm border border-slate-600 transition">Cancel</button>
                <button id="confirmOkBtn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-bold shadow-lg transition">Confirm</button>
            </div>
        </div>
    </div>

    <div id="print-area"></div>

    <!-- Edit Candidate Modal -->
    <div id="editCandModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-sky-500/30">
            <h3 class="text-lg font-bold text-sky-400 mb-4 border-b border-slate-700 pb-2">Edit Candidate</h3>
            <form id="editCandForm" onsubmit="window.saveEditCand(event)" class="space-y-3">
                <input type="hidden" id="editCandId">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label>
                    <input type="text" id="editCandName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Chest No</label>
                        <input type="text" id="editCandRegNo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Category</label>
                        <select id="editCandCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Team</label>
                    <select id="editCandTeam" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                        <option value="Al-Masūdi">Al-Masūdi</option>
                        <option value="Al-Qazwini">Al-Qazwini</option>
                    </select>
                </div>
                <div class="flex gap-3 justify-end pt-4 border-t border-slate-700/50 mt-4">
                    <button type="button" onclick="document.getElementById('editCandModal').style.display='none'" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm border border-slate-600">Cancel</button>
                    <button type="submit" id="saveEditCandBtn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Program Modal -->
    <div id="editProgModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-emerald-500/30 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">Edit Program Settings</h3>
            <form id="editProgForm" onsubmit="window.saveEditProg(event)" class="space-y-3">
                <input type="hidden" id="editProgId">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Prog No</label>
                        <input type="text" id="editProgNo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 text-sm font-mono">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label>
                        <input type="text" id="editProgName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 text-sm">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Category</label>
                        <select id="editProgCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Type</label>
                        <select id="editProgType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Stage">Stage</option>
                            <option value="Non-Stage">Non-Stage</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Format</label>
                        <select id="editProgFormat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm text-pink-300 font-bold">
                            <option value="Individual">Individual</option>
                            <option value="Group">Group (Exempt from Limits/Kala)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Points Scheme</label>
                        <select id="editProgPts" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm text-green-300 font-bold">
                            <option value="10,5,3">10, 5, 3 (Individual)</option>
                            <option value="15,8,5">15, 8, 5 (Group)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-700/50">
                    <label class="text-[12px] font-bold text-slate-200 flex items-center gap-2 cursor-pointer bg-slate-800/50 p-3 rounded-lg border border-slate-600">
                        <input type="checkbox" id="editProgExempt" class="w-5 h-5 accent-emerald-500"> 
                        Exclude from Participant Limits
                    </label>
                    <p class="text-[9px] text-slate-400 mt-1 italic pl-1">Check this to allow candidates to join this event even if their Stage/Non-Stage slots are full.</p>
                </div>

                <div class="flex gap-3 justify-end pt-4 border-t border-slate-700/50 mt-4">
                    <button type="button" onclick="document.getElementById('editProgModal').style.display='none'" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm border border-slate-600">Cancel</button>
                    <button type="submit" id="saveEditProgBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-lg">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assign Programs Modal -->
    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">Assign Programs</h3>
            <p class="text-xs text-sky-400 mb-2 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            
            <div id="limitsInfo" class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 flex justify-around mb-4 text-xs font-bold shadow-inner">
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Stage Used</span><span id="limitStage" class="text-sky-300 text-lg">0/0</span></div>
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Non-Stage Used</span><span id="limitNonStage" class="text-emerald-300 text-lg">0/0</span></div>
            </div>

            <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="window.closeAssign()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button id="saveAssignBtn" onclick="window.saveAssign()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold transition shadow-lg">Save Selection</button>
            </div>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col">
        <div class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen text-slate-400">
            <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-sky-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Loading Workspace...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8",
            measurementId: "G-DX50SRTWJS"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        const appId = 'urava-s4-fest';
        const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
        const getDocRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

        const TEAMS = ['Al-Masūdi', 'Al-Qazwini'];
        const CATEGORIES = ['Junior', 'Senior']; 
        const ADMIN_PASSWORD = "admin";

        let isAuthStatus = false;
        try { isAuthStatus = sessionStorage.getItem('admin_auth') === 'true'; } catch(e) {}

        let state = {
            isAuthenticated: isAuthStatus,
            tab: 'dashboard', 
            candidates: [], programs: [], results: [],
            searchQuery: '', searchProgQuery: '', searchResQuery: '',
            filterTeam: 'All', filterCat: 'All', filterResultCat: 'All'
        };
        window.state = state;

        window.updateSearch = (val) => { state.searchQuery = val; window.render(); const s = document.getElementById('searchInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };
        window.updateProgSearch = (val) => { state.searchProgQuery = val; window.render(); const s = document.getElementById('searchProgInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };
        window.updateResSearch = (val) => { state.searchResQuery = val; window.render(); const s = document.getElementById('searchResInput'); if(s) {s.focus(); s.setSelectionRange(s.value.length, s.value.length);} };

        window.fireConfetti = () => {
            var duration = 3 * 1000; var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#38bdf8', '#34d399', '#f8fafc', '#818cf8'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#38bdf8', '#34d399', '#f8fafc', '#818cf8'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        };

        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast'); 
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-slate-900/95 border border-red-500/50 text-red-200' : 'bg-slate-900/95 border border-sky-500/50 text-sky-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 4000); 
        };

        window.customConfirm = (title, msg, onConfirm) => {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMsg').innerText = msg;
            document.getElementById('confirmModal').style.display = 'flex';
            const okBtn = document.getElementById('confirmOkBtn');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const newOk = okBtn.cloneNode(true); okBtn.parentNode.replaceChild(newOk, okBtn);
            const newCancel = cancelBtn.cloneNode(true); cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
            newCancel.onclick = () => { document.getElementById('confirmModal').style.display = 'none'; };
            newOk.onclick = () => { document.getElementById('confirmModal').style.display = 'none'; onConfirm(); };
        };

        const initDB = async () => { try { await signInAnonymously(auth); } catch (e) { window.showAlert("DB Auth Error", "error"); } };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(getDocRef('settings', 'config'), (snap) => {
                    if (snap.exists()) { state.programs = snap.data().programs || []; } 
                    else { setDoc(getDocRef('settings', 'config'), { programs: [] }).catch(e=>{}); }
                    window.render();
                });

                onSnapshot(getCol('candidates'), (snap) => {
                    state.candidates = snap.docs.map(d => ({ id: d.id, assignedPrograms: [], ...d.data() }));
                    window.render();
                });

                onSnapshot(getCol('results'), (snap) => {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    window.render();
                });
            }
        });
        
        initDB(); 

        window.handleLogin = (e) => {
            e.preventDefault();
            if (document.getElementById('loginPass').value === ADMIN_PASSWORD) {
                state.isAuthenticated = true; try { sessionStorage.setItem('admin_auth', 'true'); } catch(e){}
                window.showAlert("Login Successful!"); window.render(); 
            } else { window.showAlert("Incorrect PIN!", "error"); }
        };

        window.handleLogout = () => { state.isAuthenticated = false; try { sessionStorage.removeItem('admin_auth'); } catch(e){} window.render(); };
        window.switchTab = (tab) => { state.tab = tab; window.render(); };

        const generateProgramNo = () => {
            const count = state.programs.length + 1;
            return 'BDF' + String(count).padStart(4, '0');
        };

        const generateChestNo = (category) => {
            const catCands = state.candidates.filter(c => c.cat === category);
            let prefix = category === 'Junior' ? 'J' : 'S';
            let max = 100;
            catCands.forEach(c => {
                const num = parseInt(c.regNo.replace(/\D/g, ''));
                if (!isNaN(num) && num > max) max = num;
            });
            return prefix + (max + 1);
        };

        window.addNewProgram = async (e) => {
            e.preventDefault(); 
            const name = document.getElementById('pName').value; 
            const cat = document.getElementById('pCat').value; 
            const type = document.getElementById('pType').value; 
            const format = document.getElementById('pFormat').value;
            const pointScheme = document.getElementById('pPoints').value; 
            const limitExempt = document.getElementById('pLimitExempt').checked;
            const progNo = generateProgramNo();
            
            const newProg = { id: 'p' + Date.now(), progNo, name, cat, type, format, pointScheme, limitExempt, timestamp: Date.now() }; 
            const updatedProgs = [...state.programs, newProg]; 
            
            const btn = document.getElementById('addProgBtn'); btn.disabled = true; btn.innerText = 'Wait...';
            try { 
                await updateDoc(getDocRef('settings', 'config'), { programs: updatedProgs }); 
                window.showAlert(`Program Added (${progNo})`); e.target.reset();

                                    </div>
                                </div>
                                <div class="overflow-y-auto flex-1 pr-2 space-y-4 custom-scrollbar">
                                    ${sortedResults.length === 0 ? `<div class="text-center p-8 text-slate-500 text-sm">No results published yet.</div>` : ''}
                                    ${sortedResults.map(res => {
                                        const prog = state.programs.find(p => p.id === res.progId);
                                        return `
                                        <div class="bg-slate-800/50 border border-slate-700 p-5 rounded-xl relative shadow-lg">
                                            <div class="absolute top-4 right-4 flex gap-2">
                                                <button onclick="window.printCerts('${res.progId}')" class="text-emerald-300 hover:text-white bg-slate-900 px-3 py-1.5 rounded text-[10px] font-bold border border-emerald-500/30 transition shadow">🖨️ Print A4 Certs</button>
                                                <button onclick="window.deleteResult('${res.id}')" class="text-red-400 hover:text-white bg-slate-900 px-3 py-1.5 rounded text-[10px] font-bold border border-red-500/30 transition shadow">Delete</button>
                                            </div>
                                            <h4 class="font-bold text-white text-lg mb-4 pr-48">${prog ? `<span class="text-sky-400">${prog.progNo?`#${prog.progNo}`:''}</span> ${prog.name} <span class="text-[9px] text-slate-300 bg-slate-900 px-2 py-1 border border-slate-700 rounded uppercase ml-2 tracking-wider">${prog.cat}</span>` : 'Unknown Program'}</h4>
                                            <div class="space-y-1.5">
                                                ${getNamesBadgeHtml(res.first, 'border-yellow-500/40 bg-yellow-900/20', 'text-yellow-400', '🥇')}
                                                ${getNamesBadgeHtml(res.second, 'border-slate-400/40 bg-slate-800/50', 'text-slate-300', '🥈')}
                                                ${getNamesBadgeHtml(res.third, 'border-amber-600/40 bg-amber-900/20', 'text-amber-500', '🥉')}
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>`;
                }

                if (state.tab === 'settings') {
                    mainContent = `
                        <div class="max-w-2xl mx-auto mt-8 space-y-6">
                            <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-xl">
                                <h3 class="font-bold text-white text-lg mb-4 flex items-center gap-2">💾 Database Backup & Export</h3>
                                <p class="text-sm text-slate-400 mb-6">Securely download your entire fest database as a JSON file, or export candidates to a CSV spreadsheet.</p>
                                <div class="flex flex-wrap gap-4">
                                    <button onclick="window.exportData()" class="bg-sky-600 hover:bg-sky-500 text-white px-5 py-3 rounded-xl font-bold shadow-lg transition">Download Full Backup (JSON)</button>
                                    <button onclick="window.exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold shadow-lg transition">Export Candidates (CSV)</button>
                                </div>
                            </div>
                            <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-xl">
                                <h3 class="font-bold text-white text-lg mb-4 flex items-center gap-2">📥 Restore Database</h3>
                                <p class="text-sm text-slate-400 mb-4">Restore a previously downloaded JSON backup file.</p>
                                <input type="file" id="importFile" accept=".json" class="hidden" onchange="window.handleImport(event)">
                                <button onclick="window.triggerImport()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-3 rounded-xl font-bold transition border border-slate-600 shadow-lg">Select Backup File to Import</button>
                            </div>
                            <div class="glass-card p-6 rounded-2xl border border-red-500/30 bg-red-950/20 shadow-xl mt-12">
                                <h3 class="font-bold text-red-400 text-lg mb-2 flex items-center gap-2">⚠️ Danger Zone</h3>
                                <p class="text-sm text-red-300/70 mb-4">Wipe all data completely to start a new fest. This cannot be undone without a backup.</p>
                                <button onclick="window.wipeDatabase()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg transition text-sm">Wipe Entire Database</button>
                            </div>
                        </div>`;
                }

                app.innerHTML = `
                    <header class="bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 p-3 px-4 sm:px-6 flex justify-between items-center z-50 sticky top-0">
                        <div class="flex items-center gap-3">
                            <img src="${LOGO_TEXT}" alt="Logo" class="h-10 w-auto object-contain drop-shadow-md">
                            <div>
                                <h1 class="text-white text-base sm:text-xl tracking-tight leading-none mb-0.5 font-bold">Aawaaze Funoon</h1>
                                <p class="text-[9px] text-sky-400 font-bold uppercase tracking-widest">Season 04 • Fest Manager</p>
                            </div>
                        </div>
                        <button onclick="window.handleLogout()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold border border-slate-600 transition shadow">Logout</button>
                    </header>
                    ${navHtml}
                    <main class="flex-1 p-3 sm:p-6 max-w-7xl w-full mx-auto pb-10">
                        ${mainContent}
                    </main>
                `;
            } catch(e) {
                console.error("Rendering Error:", e);
                document.getElementById('app').innerHTML = `<div class="p-10 text-white text-center bg-red-900 min-h-screen flex flex-col justify-center items-center"><h1 class="text-2xl font-bold mb-4">Error Rendering UI</h1><pre class="text-xs bg-black/50 p-4 rounded max-w-2xl overflow-auto">${e.stack}</pre></div>`;
            }
        };
        
        window.render();
    </script>
</body>
</html>
