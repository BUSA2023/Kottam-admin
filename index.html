<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urava Season 04 - Fest Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { font-family: 'Anek Malayalam', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .num-font { font-family: 'Outfit', sans-serif; }
        .tab-active { border-bottom: 3px solid #38bdf8; color: #38bdf8; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #94a3b8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 0.9em; padding-right: 2.2rem !important; }
        select option { background-color: #0f172a; color: #f8fafc; }
        
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; }
            .id-a4-page { width: 210mm; height: 297mm; page-break-after: always; display: grid; grid-template-columns: repeat(2, 70mm); grid-template-rows: repeat(2, 95mm); gap: 20mm 25mm; justify-content: center; align-content: center; box-sizing: border-box; background: white !important; }
            .id-a4-page:last-child { page-break-after: auto; }
            .id-card { width: 70mm !important; height: 95mm !important; background: white !important; color: black !important; border: 2px solid #0284c7; padding: 4mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Outfit', 'Anek Malayalam', sans-serif; border-radius: 8px; page-break-inside: avoid; }
            .id-header { text-align: center; border-bottom: 2px solid #0ea5e9; padding-bottom: 3px; margin-bottom: 3px; }
            .id-title { font-size: 10.5pt; font-weight: 900; margin: 0; color: #0284c7 !important; text-transform: uppercase; letter-spacing: 0.5px; }
            .id-sub { font-size: 7pt; margin: 1px 0 0 0; font-weight: 800; color: #334155 !important; text-transform: uppercase; }
            .id-body { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; padding: 1mm 0; }
            .id-top-row { display: flex; align-items: center; justify-content: center; gap: 3mm; width: 100%; margin-bottom: 3px; }
            .id-chest { font-size: 19pt; font-weight: 900; margin: 0; color: #0f172a !important; background: #f1f5f9 !important; border: 1.5px solid #cbd5e1; padding: 2px 10px; border-radius: 6px; line-height: 1.1; }
            .id-qr-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: white !important; border: 1px solid #cbd5e1; padding: 2px; border-radius: 4px; }
            .id-qr { width: 15mm !important; height: 15mm !important; object-fit: contain; display: block; }
            .id-qr-text { font-size: 4.5pt; font-weight: 800; color: #0284c7 !important; text-transform: uppercase; margin-top: 1px; letter-spacing: 0.2px; }
            .id-name { font-size: 11.5pt; font-weight: 800; margin: 3px 0; line-height: 1.15; max-height: 2.3em; overflow: hidden; color: #0f172a !important; width: 100%; }
            .id-team { font-size: 8pt; font-weight: 800; background: #e0f2fe !important; color: #0369a1 !important; border: 1px solid #bae6fd; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 1px; }
            .id-footer { font-size: 6.5pt; border-top: 1px dashed #94a3b8; padding-top: 3px; text-align: center; height: 22mm; overflow: hidden; color: #334155 !important; display: flex; flex-direction: column; justify-content: flex-start; line-height: 1.25; }
            .id-footer-title { font-weight: 800; font-size: 6pt; text-transform: uppercase; color: #0284c7 !important; margin-bottom: 2px; }
            .print-prog-page { width: 210mm; min-height: 297mm; page-break-after: always; background: white !important; color: black !important; padding: 15mm; font-family: 'Outfit', 'Anek Malayalam', sans-serif; box-sizing: border-box; }
            .print-prog-page:last-child { page-break-after: auto; }
            .print-prog-header { text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 15px; }
            .print-prog-page h1 { font-size: 20pt; margin: 0 0 6px 0; color: #0f172a !important; font-weight: 900; text-transform: uppercase; }
            .print-prog-count { font-size: 11pt; font-weight: 800; color: #334155 !important; margin: 0; }
            .print-prog-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11pt; }
            .print-prog-table th, .print-prog-table td { border: 1.5px solid #0f172a; padding: 10px 12px; text-align: left; color: #0f172a !important; }
            .print-prog-table th { background-color: #f1f5f9 !important; text-align: center; font-weight: 800; font-size: 10pt; text-transform: uppercase; letter-spacing: 0.5px; }
            .cert-page { width: 210mm; height: 297mm; page-break-after: always; position: relative; background: white !important; color: black !important; overflow: hidden; box-sizing: border-box; padding: 20mm; font-family: 'Anek Malayalam', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
            .cert-border { position: absolute; top: 12mm; bottom: 12mm; left: 12mm; right: 12mm; border: 5px double #0ea5e9; border-radius: 15px; z-index: -1; }
            .cert-logo { max-width: 160px; margin-bottom: 20px; object-fit: contain; }
            .cert-header { font-size: 32pt; font-weight: 900; color: #0284c7 !important; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-family: 'Outfit', sans-serif; }
            .cert-sub { font-size: 16pt; font-weight: bold; color: #334155 !important; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }
            .cert-text { font-size: 16pt; margin-bottom: 15px; color: #475569 !important; }
            .cert-name { font-size: 30pt; font-weight: bold; color: #0f172a !important; margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; width: 80%; margin-left: auto; margin-right: auto; }
            .cert-position { font-size: 24pt; font-weight: 900; color: #0284c7 !important; margin-top: 20px; margin-bottom: 10px; }
            .cert-prog { font-size: 20pt; font-weight: bold; color: #1e293b !important; margin-bottom: 50px; }
            .cert-signatures { display: flex; justify-content: space-between; width: 100%; margin-top: auto; padding-top: 50px; }
            .cert-sig-block { text-align: center; border-top: 1px solid black; width: 200px; padding-top: 5px; font-weight: bold; font-size: 12pt; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-sky-950 to-slate-900 min-h-screen">

    <div id="toast" class="fixed top-5 right-5 z-[500] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span><span id="toastMsg"></span>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[400] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full shadow-2xl border border-sky-500/30 text-center">
            <h3 class="text-xl font-bold text-white mb-2" id="confirmTitle">Confirm</h3>
            <p class="text-sm text-slate-300 mb-6" id="confirmMsg">Are you sure?</p>
            <div class="flex gap-3 justify-center">
                <button id="confirmCancelBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm border border-slate-600 transition">Cancel</button>
                <button id="confirmOkBtn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-bold shadow-lg transition">Confirm</button>
            </div>
        </div>
    </div>

    <div id="print-area"></div>

    <!-- Edit Candidate Modal -->
    <div id="editCandModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-sky-500/30">
            <h3 class="text-lg font-bold text-sky-400 mb-4 border-b border-slate-700 pb-2">Edit Candidate</h3>
            <form id="editCandForm" onsubmit="window.saveEditCand(event)" class="space-y-3">
                <input type="hidden" id="editCandId">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label>
                    <input type="text" id="editCandName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Chest No</label>
                        <input type="text" id="editCandRegNo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-sky-500 text-sm font-mono">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Category</label>
                        <select id="editCandCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Team</label>
                    <select id="editCandTeam" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                        <option value="Al-Masūdi">Al-Masūdi</option>
                        <option value="Al-Qazwini">Al-Qazwini</option>
                    </select>
                </div>
                <div class="flex gap-3 justify-end pt-4 border-t border-slate-700/50 mt-4">
                    <button type="button" onclick="document.getElementById('editCandModal').style.display='none'" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm border border-slate-600">Cancel</button>
                    <button type="submit" id="saveEditCandBtn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-bold shadow-lg">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Program Modal -->
    <div id="editProgModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[300] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl border border-emerald-500/30 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-lg font-bold text-emerald-400 mb-4 border-b border-slate-700 pb-2">Edit Program Settings</h3>
            <form id="editProgForm" onsubmit="window.saveEditProg(event)" class="space-y-3">
                <input type="hidden" id="editProgId">
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Prog No</label>
                        <input type="text" id="editProgNo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 text-sm font-mono">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Name</label>
                        <input type="text" id="editProgName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none focus:border-emerald-500 text-sm">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Category</label>
                        <select id="editProgCat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Junior">Junior</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Type</label>
                        <select id="editProgType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm">
                            <option value="Stage">Stage</option>
                            <option value="Non-Stage">Non-Stage</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-2">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Format</label>
                        <select id="editProgFormat" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm text-pink-300 font-bold">
                            <option value="Individual">Individual</option>
                            <option value="Group">Group (Exempt from Limits/Kala)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Points Scheme</label>
                        <select id="editProgPts" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none text-sm text-green-300 font-bold">
                            <option value="10,5,3">10, 5, 3 (Individual)</option>
                            <option value="15,8,5">15, 8, 5 (Group)</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-700/50 space-y-2">
                    <label class="text-[12px] font-bold text-slate-200 flex items-center gap-2 cursor-pointer bg-slate-800/50 p-3 rounded-lg border border-slate-600">
                        <input type="checkbox" id="editProgExempt" class="w-5 h-5 accent-emerald-500"> 
                        Exclude from Participant Limits
                    </label>
                    <label class="text-[12px] font-bold text-red-300 flex items-center gap-2 cursor-pointer bg-red-950/30 p-3 rounded-lg border border-red-700/50">
                        <input type="checkbox" id="editProgCancelled" class="w-5 h-5 accent-red-500"> 
                        🚫 Mark Program as Cancelled
                    </label>
                </div>

                <div class="flex gap-3 justify-end pt-4 border-t border-slate-700/50 mt-4">
                    <button type="button" onclick="document.getElementById('editProgModal').style.display='none'" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm border border-slate-600">Cancel</button>
                    <button type="submit" id="saveEditProgBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-lg">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assign Programs Modal -->
    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card p-6 rounded-2xl max-w-lg w-full shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">Assign Programs</h3>
            <p class="text-xs text-sky-400 mb-2 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            
            <div id="limitsInfo" class="bg-slate-800/80 p-3 rounded-lg border border-slate-700 flex justify-around mb-4 text-xs font-bold shadow-inner">
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Stage Used</span><span id="limitStage" class="text-sky-300 text-lg">0/0</span></div>
                <div class="text-center"><span class="text-slate-400 block uppercase text-[9px]">Non-Stage Used</span><span id="limitNonStage" class="text-emerald-300 text-lg">0/0</span></div>
            </div>

            <div class="bg-slate-900/60 border border-slate-700 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="window.closeAssign()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button id="saveAssignBtn" onclick="window.saveAssign()" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-sm font-semibold transition shadow-lg">Save Selection</button>
            </div>
        </div>
    </div>

    <!-- Manage Group Members Modal (Two Groups: Al-Masūdi & Al-Qazwini) -->
    <div id="groupAssignModal" style="display: none;" class="fixed inset-0 bg-black/90 z-[250] items-center justify-center p-3 sm:p-4 backdrop-blur-sm">
        <div class="glass-card p-4 sm:p-6 rounded-2xl max-w-4xl w-full shadow-2xl flex flex-col max-h-[92vh] border border-pink-500/40">
            <div class="flex justify-between items-start border-b border-slate-700 pb-3 mb-3">
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-pink-400" id="groupModalTitle">Manage Group Members (2 Groups)</h3>
                    <p class="text-[10px] sm:text-xs text-slate-400 font-bold uppercase tracking-wider mt-0.5" id="groupModalSubtitle"></p>
                </div>
                <button onclick="window.closeGroupAssign()" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-bold border border-slate-600">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 overflow-y-auto pr-1 custom-scrollbar">
                <!-- Group 1: Al-Masūdi -->
                <div class="bg-slate-900/70 border border-sky-500/30 rounded-xl p-3 flex flex-col max-h-[58vh]">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                        <span class="font-bold text-sky-400 text-xs sm:text-sm uppercase tracking-wider">👥 Group 1: Al-Masūdi</span>
                        <div class="flex gap-1.5">
                            <button type="button" onclick="window.toggleAllGroupTeam('Al-Masūdi', true)" class="text-[10px] bg-sky-900/60 hover:bg-sky-800 text-sky-200 px-2 py-0.5 rounded border border-sky-700/50 font-bold">Select All</button>
                            <button type="button" onclick="window.toggleAllGroupTeam('Al-Masūdi', false)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700 font-bold">Clear</button>
                        </div>
                    </div>
                    <div id="groupListMasudi" class="space-y-1.5 overflow-y-auto flex-1 pr-1 custom-scrollbar"></div>
                </div>
                <!-- Group 2: Al-Qazwini -->
                <div class="bg-slate-900/70 border border-emerald-500/30 rounded-xl p-3 flex flex-col max-h-[58vh]">
                    <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800">
                        <span class="font-bold text-emerald-400 text-xs sm:text-sm uppercase tracking-wider">👥 Group 2: Al-Qazwini</span>
                        <div class="flex gap-1.5">
                            <button type="button" onclick="window.toggleAllGroupTeam('Al-Qazwini', true)" class="text-[10px] bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded border border-emerald-700/50 font-bold">Select All</button>
                            <button type="button" onclick="window.toggleAllGroupTeam('Al-Qazwini', false)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700 font-bold">Clear</button>
                        </div>
                    </div>
                    <div id="groupListQazwini" class="space-y-1.5 overflow-y-auto flex-1 pr-1 custom-scrollbar"></div>
                </div>
            </div>
            <div class="flex justify-between items-center pt-3 mt-3 border-t border-slate-800">
                <span class="text-[11px] text-pink-300 font-semibold italic">Note: Group points add to Team Total only.</span>
                <div class="flex gap-2">
                    <button onclick="window.closeGroupAssign()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs sm:text-sm font-semibold border border-slate-600">Cancel</button>
                    <button id="saveGroupAssignBtn" onclick="window.saveGroupAssign()" class="px-5 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-xs sm:text-sm font-bold shadow-lg">Save Both Groups</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col">
        <div class="flex-1 flex flex-col items-center justify-center p-4 min-h-screen text-slate-400">
            <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-sky-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Connecting to Fest Database...
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy4XPx_UwsoLzh3PTCgfsccZxz5Oc80n8",
            authDomain: "fest-66fe3.firebaseapp.com",
            projectId: "fest-66fe3",
            storageBucket: "fest-66fe3.firebasestorage.app",
            messagingSenderId: "1044450457376",
            appId: "1:1044450457376:web:94c5aa76b0bf7a2fc20945"
        };

        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        const appId = 'urava-s4-fest';
        const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

                if (prog && !prog.cancelled && prog.format !== 'Group' && prog.limitExempt !== true) {

            if (!currentGroupProgId) return;
            const prog = state.programs.find(p => p.id === currentGroupProgId); if (!prog) return;
            try {
                const selectedIds = new Set(Array.from(document.querySelectorAll('.group-cand-chk:checked')).map(el => el.value));
                for (const c of state.candidates.filter(c => c.cat === prog.cat)) {
                    const currentArr = Array.isArray(c.assignedPrograms) ? [...c.assignedPrograms] : [];
                    const hasProg = currentArr.includes(currentGroupProgId);
                    const shouldHave = selectedIds.has(c.id);
                    if (shouldHave && !hasProg) {
                        currentArr.push(currentGroupProgId);
                        await updateDoc(getDocRef('candidates', c.id), { assignedPrograms: currentArr });

                        await updateDoc(getDocRef('candidates', c.id), { assignedPrograms: currentArr.filter(pid => pid !== currentGroupProgId) });

            if (prog.format === 'Group') {
                const detectSelectedTeam = (arr) => {

                        if (c && c.team) return `TEAM:${c.team}`;

                    return "";

                const sel1 = resToLoad ? detectSelectedTeam(resToLoad.first) : "";
                const sel2 = resToLoad ? detectSelectedTeam(resToLoad.second) : "";
                const sel3 = resToLoad ? detectSelectedTeam(resToLoad.third) : "";

        window.render();
